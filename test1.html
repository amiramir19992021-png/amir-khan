<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست امیرخوان</title>
    <style>
        body { font-family: Tahoma; text-align: center; padding: 30px; direction: rtl; background: #f0f2f5; }
        .box { background: white; max-width: 500px; margin: auto; padding: 30px; border-radius: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 80px; border-radius: 16px; border: 2px solid #ddd; padding: 12px; font-family: inherit; }
        button { margin-top: 15px; padding: 14px 40px; background: #3b82f6; color: white; border: none; border-radius: 30px; font-size: 18px; cursor: pointer; width: 100%; }
        .news-item { background: #f1f5f9; padding: 12px; margin: 8px 0; border-radius: 12px; border-right: 4px solid #3b82f6; text-align: right; }
        #result { background: #f8fafc; padding: 15px; border-radius: 16px; margin-top: 15px; display: none; white-space: pre-wrap; text-align: right; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🧠 تست امیرخوان</h1>
        <p>این یک صفحه‌ی جداگانه برای تست است</p>

        <h2>🔎 تحلیل خبر</h2>
        <textarea id="newsText" placeholder="متن خود را اینجا بنویس..."></textarea>
        <button id="analyzeBtn">✨ تحلیل کن</button>
        <div id="result"></div>

        <h2>📡 اخبار نمونه</h2>
        <div id="newsList">
            <div class="news-item">🔥 قیمت دلار امروز در بازار آزاد</div>
            <div class="news-item">📈 اعلام نتایج نهایی کنکور ۱۴۰۵</div>
            <div class="news-item">⚠️ هشدار سطح نارنجی هواشناسی</div>
        </div>
    </div>

    <script>
        // دکمه تحلیل
        document.getElementById('analyzeBtn').addEventListener('click', function() {
            const text = document.getElementById('newsText').value.trim();
            const resultDiv = document.getElementById('result');

            if (text === '') {
                alert('⚠️ لطفاً یک متن وارد کن.');
                return;
            }

            const words = text.split(' ');
            let analysis = `📊 تعداد کلمات: ${words.length}\n`;
            if (text.includes('دولت') || text.includes('سیاست')) analysis += '🏛️ محتوای سیاسی\n';
            if (text.includes('دلار') || text.includes('قیمت')) analysis += '💰 محتوای اقتصادی\n';

            resultDiv.style.display = 'block';
            resultDiv.textContent = analysis;
        });
    </script>
</body>
</html>
