<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیرخوان - ایرنا، مهر و ایسنا</title>
    <style>
        body { font-family: Tahoma; background: #f0f2f5; padding: 20px; direction: rtl; }
        .box { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 25px; }
        .news-item { background: #f1f5f9; padding: 12px; margin: 8px 0; border-radius: 12px; border-right: 4px solid #3b82f6; }
        button { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 30px; font-size: 18px; margin-top: 10px; cursor: pointer; }
        #result { background: #f8fafc; padding: 15px; border-radius: 12px; margin-top: 15px; display: none; white-space: pre-wrap; }
        .tabs { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .tabs button { flex: 1; padding: 10px; background: #e2e8f0; border: none; border-radius: 20px; cursor: pointer; min-width: 60px; }
        .tabs .active { background: #1e293b; color: white; }
        .loading { color: #64748b; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🧠 امیرخوان</h1>
        <p>دستیار هوشمند رسانه</p>

        <h2>📡 رادار خبری</h2>
        <div class="tabs">
            <button class="active" data-url="irna">🇮🇷 ایرنا</button>
            <button data-url="mehr">🇮🇷 مهر</button>
            <button data-url="isna">🇮🇷 ایسنا</button>
        </div>
        <div id="newsList"><div class="loading">⏳ انتخاب کنید...</div></div>

        <h2>🔎 تحلیل خبر</h2>
        <textarea id="newsText" placeholder="متن خبر را وارد کن..."></textarea>
        <button id="analyzeBtn">✨ تحلیل کن</button>
        <div id="result"></div>
    </div>

    <script>
        // ============================
        //  دریافت اخبار از RSS
        // ============================
        async function fetchNews(source) {
            const list = document.getElementById('newsList');
            list.innerHTML = '<div class="loading">⏳ در حال بارگذاری...</div>';
            
            let rssUrl = '';
            if (source === 'irna') rssUrl = 'https://www.irna.ir/rss';
            else if (source === 'mehr') rssUrl = 'https://www.mehrnews.com/rss';
            else if (source === 'isna') rssUrl = 'https://www.isna.ir/rss';

            try {
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    list.innerHTML = data.items.slice(0, 10).map(item => 
                        `<div class="news-item">📰 ${item.title}</div>`
                    ).join('');
                } else {
                    list.innerHTML = '<div class="news-item">📭 خبری برای نمایش وجود ندارد.</div>';
                }
            } catch (error) {
                // اگر rss2json کار نکرد، برای ایسنا از روش جایگزین استفاده کن
                if (source === 'isna') {
                    try {
                        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://www.isna.ir/rss')}`;
                        const response = await fetch(proxyUrl);
                        const text = await response.text();
                        // استخراج ساده عناوین از XML
                        const titles = text.match(/<title>(.*?)<\/title>/g);
                        if (titles && titles.length > 1) {
                            const items = titles.slice(1, 11).map(title => 
                                `<div class="news-item">📰 ${title.replace(/<title>|<\/title>/g, '')}</div>`
                            ).join('');
                            list.innerHTML = items;
                        } else {
                            list.innerHTML = '<div class="news-item">📭 خبری برای نمایش وجود ندارد.</div>';
                        }
                    } catch (proxyError) {
                        list.innerHTML = '<div class="news-item">⚠️ خطا در دریافت اخبار ایسنا.</div>';
                    }
                } else {
                    list.innerHTML = '<div class="news-item">⚠️ خطا در دریافت اخبار. لطفاً دوباره تلاش کنید.</div>';
                }
            }
        }

        // ============================
        //  دکمه‌های رادار
        // ============================
        document.querySelectorAll('.tabs button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const source = this.getAttribute('data-url');
                fetchNews(source);
            });
        });

        // ============================
        //  دکمه‌ی تحلیل
        // ============================
        document.getElementById('analyzeBtn').addEventListener('click', function() {
            const text = document.getElementById('newsText').value.trim();
            const resultDiv = document.getElementById('result');

            if (text === '') {
                alert('⚠️ لطفاً یک متن برای تحلیل وارد کن.');
                return;
            }

            const words = text.split(' ');
            let analysis = `📊 تعداد کلمات: ${words.length}\n`;
            if (text.includes('دولت') || text.includes('سیاست')) analysis += '🏛️ محتوای سیاسی\n';
            if (text.includes('دلار') || text.includes('قیمت')) analysis += '💰 محتوای اقتصادی\n';

            resultDiv.style.display = 'block';
            resultDiv.textContent = analysis;
        });

        // ============================
        //  بارگذاری اولیه (ایرنا)
        // ============================
        fetchNews('irna');
    </script>
</body>
</html>
