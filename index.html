<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیرخوان - لینک به خبر کامل</title>
    <style>
        body { font-family: Tahoma; background: #f0f2f5; padding: 20px; direction: rtl; }
        .box { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 25px; }
        .news-item {
            background: #f1f5f9;
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            border-right: 4px solid #3b82f6;
            transition: 0.2s;
        }
        .news-item:hover { background: #e2e8f0; }
        .news-item a {
            text-decoration: none;
            color: #1e293b;
            display: block;
        }
        .news-item a:hover { color: #3b82f6; }
        .news-item .summary {
            font-size: 0.9em;
            color: #64748b;
            margin-top: 5px;
        }
        button { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 30px; font-size: 18px; margin-top: 10px; cursor: pointer; }
        #result { background: #f8fafc; padding: 15px; border-radius: 12px; margin-top: 15px; display: none; white-space: pre-wrap; }
        .tabs { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .tabs button { flex: 1; padding: 10px; background: #e2e8f0; border: none; border-radius: 20px; cursor: pointer; min-width: 60px; }
        .tabs .active { background: #1e293b; color: white; }
        .loading { color: #64748b; text-align: center; padding: 20px; }
        .section-title { margin-top: 25px; border-top: 2px solid #e2e8f0; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🧠 امیرخوان</h1>
        <p>دستیار هوشمند رسانه</p>

        <h2>📡 رادار خبری</h2>
        <div class="section-title">🇮🇷 خبرگزاری‌های داخلی</div>
        <div class="tabs">
            <button class="active" data-url="https://www.irna.ir/rss">ایرنا</button>
            <button data-url="https://www.mehrnews.com/rss">مهر</button>
            <button data-url="https://www.imna.ir/rss">ایمنا</button>
        </div>
        
        <div id="newsList"><div class="loading">⏳ انتخاب کنید...</div></div>

        <h2>🔎 تحلیل خبر</h2>
        <textarea id="newsText" placeholder="متن خبر را وارد کن..."></textarea>
        <button id="analyzeBtn">✨ تحلیل کن</button>
        <div id="result"></div>
    </div>

    <script>
        // ============================
        //  دریافت اخبار از RSS
        // ============================
        async function fetchNews(rssUrl) {
            const list = document.getElementById('newsList');
            list.innerHTML = '<div class="loading">⏳ در حال بارگذاری...</div>';
            try {
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    list.innerHTML = data.items.slice(0, 10).map(item => {
                        // استخراج لینک خبر
                        const link = item.link || '#';
                        // استخراج خلاصه (لید)
                        const summary = item.description || item.content || 'متن کامل این خبر در خبرگزاری قابل مشاهده است.';
                        const shortSummary = summary.length > 100 ? summary.substring(0, 100) + '...' : summary;
                        
                        return `
                            <div class="news-item">
                                <a href="${link}" target="_blank">
                                    📰 ${item.title}
                                    <div class="summary">${shortSummary}</div>
                                </a>
                            </div>
                        `;
                    }).join('');
                } else {
                    list.innerHTML = '<div class="news-item">📭 خبری برای نمایش وجود ندارد.</div>';
                }
            } catch (error) {
                list.innerHTML = '<div class="news-item">⚠️ خطا در دریافت اخبار. لطفاً دوباره تلاش کنید.</div>';
                console.log('خطا:', error);
            }
        }

        // ============================
        //  دکمه‌های رادار
        // ============================
        document.querySelectorAll('.tabs button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const url = this.getAttribute('data-url');
                fetchNews(url);
            });
        });

        // ============================
        //  دکمه‌ی تحلیل
        // ============================
        document.getElementById('analyzeBtn').addEventListener('click', function() {
            const text = document.getElementById('newsText').value.trim();
            const resultDiv = document.getElementById('result');

            if (text === '') {
                alert('⚠️ لطفاً یک متن برای تحلیل وارد کن.');
                return;
            }

            const words = text.split(' ');
            let analysis = `📊 تعداد کلمات: ${words.length}\n`;
            if (text.includes('دولت') || text.includes('سیاست')) analysis += '🏛️ محتوای سیاسی\n';
            if (text.includes('دلار') || text.includes('قیمت')) analysis += '💰 محتوای اقتصادی\n';

            resultDiv.style.display = 'block';
            resultDiv.textContent = analysis;
        });

        // ============================
        //  بارگذاری اولیه (ایرنا)
        // ============================
        fetchNews('https://www.irna.ir/rss');
    </script>
</body>
</html>
