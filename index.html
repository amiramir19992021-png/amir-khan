<script>
// ================================
//  کلید Gemini API
// ================================
const GEMINI_API_KEY = 'AQ.Ab8RN6ILZxjXZZ9kYdNaX6mNaBuA7mJymOm5zs6OiVWGBO-eXw';

// ================================
//  تابع ارتباط با Gemini
// ================================
async function callGemini(prompt) {
    try {
        const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`,
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            }
        );
        const data = await res.json();
        if (data.candidates && data.candidates.length > 0) {
            return data.candidates[0].content.parts[0].text;
        }
        return 'پاسخی دریافت نشد. لطفاً دوباره تلاش کنید.';
    } catch (error) {
        console.error('خطا:', error);
        return '⚠️ خطا در ارتباط با Gemini.';
    }
}

// ================================
//  چت‌بات
// ================================
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('chatToggle');
    const closeBtn = document.getElementById('chatClose');
    const windowChat = document.getElementById('chatWindow');
    const sendBtn = document.getElementById('chatSend');
    const input = document.getElementById('chatInput');
    const messages = document.getElementById('chatMessages');

    toggleBtn.addEventListener('click', () => windowChat.classList.toggle('active'));
    closeBtn.addEventListener('click', () => windowChat.classList.remove('active'));

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        const userDiv = document.createElement('div');
        userDiv.className = 'user';
        userDiv.textContent = text;
        messages.appendChild(userDiv);
        input.value = '';
        messages.scrollTop = messages.scrollHeight;

        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'bot';
        loadingDiv.textContent = '⏳ ...';
        messages.appendChild(loadingDiv);
        messages.scrollTop = messages.scrollHeight;

        const reply = await callGemini(text);
        loadingDiv.remove();
        const botDiv = document.createElement('div');
        botDiv.className = 'bot';
        botDiv.textContent = reply;
        messages.appendChild(botDiv);
        messages.scrollTop = messages.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
});

// ================================
//  ابزارهای هوش مصنوعی
// ================================
async function aiAction(type) {
    const input = document.getElementById('aiInput');
    const result = document.getElementById('aiResult');
    const text = input.value.trim();
    
    if (!text) {
        alert('لطفاً یک متن یا موضوع وارد کنید.');
        return;
    }

    result.innerHTML = '<div class="loading">⏳ در حال پردازش با Gemini...</div>';
    result.classList.add('show');

    let prompt = '';
    switch(type) {
        case 'image':
            prompt = `بر اساس متن زیر، یک تصویر مرتبط پیشنهاد بده و لینک یک تصویر رایگان از Unsplash یا Pexels برای این موضوع پیدا کن. موضوع: ${text}`;
            break;
        case 'video':
            prompt = `بر اساس متن زیر، یک فیلم مرتبط پیشنهاد بده و لینک یک فیلم رایگان از Pexels یا GIPHY برای این موضوع پیدا کن. موضوع: ${text}`;
            break;
        case 'voice':
            prompt = `فرض کن این متن از روی یک فایل صوتی پیاده شده است. آن را ویرایش کن و یک متن روان و رسمی بنویس: ${text}`;
            break;
        case 'analyze':
            prompt = `تحلیل عمیق و کامل این متن را انجام بده. احساسات، موضوع، کلمات کلیدی و خلاصه: ${text}`;
            break;
        case 'summary':
            prompt = `خلاصه‌ای دقیق و کامل از این متن بنویس: ${text}`;
            break;
        case 'report':
            prompt = `یک گزارش حرفه‌ای و ساختاریافته از این متن بنویس: ${text}`;
            break;
        default:
            prompt = `پردازش کن: ${text}`;
    }

    const response = await callGemini(prompt);
    result.innerHTML = `<div>✅ ${response}</div>`;
}

// ================================
//  استخراج ترندها
// ================================
function extractTrends(items) {
    const allWords = [];
    items.forEach(item => {
        const title = item.title || '';
        const desc = item.description || '';
        const text = (title + ' ' + desc).replace(/<[^>]*>/g, '');
        const words = text.split(' ');
        words.forEach(w => { if (w.length > 4) allWords.push(w); });
    });
    const wordFreq = {};
    allWords.forEach(w => { wordFreq[w] = (wordFreq[w] || 0) + 1; });
    const sorted = Object.entries(wordFreq).sort((a, b) => b[1] - a[1]);
    return sorted.slice(0, 6).map(item => item[0]);
}

// ================================
//  دریافت اخبار
// ================================
async function fetchNews(rssUrl, fromLang) {

        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
        const response = await fetch(apiUrl);

        if (!data.items || data.items.length === 0) {
            container.innerHTML = '<div class="loading">📭 خبری برای نمایش وجود ندارد.</div>';
            document.getElementById('trendItems').innerHTML = '<span>📭 ترندی یافت نشد</span>';
            return;
        }

        const trends = extractTrends(data.items);
        document.getElementById('trendItems').innerHTML = trends.map(t => `<span>#${t}</span>`).join('');

        const isForeign = fromLang !== 'fa';
        const items = data.items.slice(0, 10);
        let html = '';

        for (const item of items) {
            const link = item.link || '#';
            const title = item.title || 'بدون عنوان';
            let summary = item.description ? item.description.replace(/<[^>]*>/g, '').trim() : title;
            if (!summary || summary.length < 5) summary = title;
            const shortSummary = summary.length > 120 ? summary.substring(0, 120) + '...' : summary;

            let timeAgo = '';
            if (item.pubDate) {
                try {
                    const date = new Date(item.pubDate);
                    const now = new Date();
                    const diffMins = Math.floor((now - date) / 60000);
                    if (diffMins < 60) timeAgo = `${diffMins} دقیقه پیش`;
                    else if (diffMins < 1440) timeAgo = `${Math.floor(diffMins/60)} ساعت پیش`;
                    else timeAgo = `${Math.floor(diffMins/1440)} روز پیش`;
                } catch { timeAgo = ''; }
            }

            html += `
                <div class="news-card" data-link="${link}">
                    <div class="title">📰 ${title}</div>
                    <div class="meta">🕒 ${timeAgo || 'تاریخ نامشخص'}</div>
                    <div class="snippet">${shortSummary}</div>
                    <div class="summary-box">
                        <div>📌 خلاصه: ${summary}</div>
                        ${isForeign ? `<div style="margin-top:6px;"><a href="https://translate.google.com/translate?sl=en&tl=fa&u=${encodeURIComponent(link)}" target="_blank" style="color:#818cf8;">🌐 ترجمه با گوگل</a></div>` : ''}
                        <a href="${link}" target="_blank" style="color:#818cf8;display:inline-block;margin-top:6px;">🔗 مطالعه کامل</a>
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;

        document.querySelectorAll('.news-card').forEach(card => {
            card.addEventListener('click', function(e) {
                if (e.target.tagName === 'A') return;
                const box = this.querySelector('.summary-box');
                const isOpen = box.classList.contains('show');
                document.querySelectorAll('.news-card .summary-box').forEach(el => el.classList.remove('show'));
                if (!isOpen) {
                    box.classList.add('show');
                    setTimeout(() => this.scrollInto
