<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیرخوان - دستیار هوشمند رسانه</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- هدر -->
        <header>
            <h1>🧠 امیرخوان</h1>
            <p>دستیار هوشمند رسانه</p>
        </header>

        <!-- بخش تحلیل خبر -->
        <section class="analysis">
            <h2>🔎 تحلیل خبر</h2>
            <textarea placeholder="لینک یا متن خبر را وارد کن..."></textarea>
            <button>✨ تحلیل کن</button>
        </section>

        <!-- بخش رادار خبری -->
        <section class="radar">
            <h2>📡 رادار خبری</h2>
            <div class="tabs">
                <button class="active">🇮🇷 ایران</button>
                <button>🌍 جهان</button>
            </div>
            <ul class="news-list">
                <li>🔥 مهم‌ترین اخبار</li>
                <li>📈 اخبار در حال رشد</li>
                <li>⚠️ نیازمند بررسی</li>
            </ul>
        </section>

        <!-- بخش ابزارها -->
        <section class="tools">
            <button>🌍 ترجمه</button>
            <button>📰 خبر</button>
            <button>📈 SEO</button>
            <button>🔎 فکت‌چک</button>
            <button>🎙 پادکست</button>
            <button>🖼 تصویر</button>
            <button>🎬 ویدئو</button>
            <button>📊 تحلیل</button>
        </section>

        <!-- فوتر -->
        <footer>
            <p>⚡ امیرخوان - نسخه‌ی اول</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
