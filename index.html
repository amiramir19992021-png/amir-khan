<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیرخوان - تحلیلگر خبر</title>
    <style>
        body { font-family: Tahoma; background: #f0f2f5; padding: 20px; direction: rtl; }
        .box { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 25px; }
        textarea { width: 100%; height: 80px; border-radius: 12px; border: 2px solid #ddd; padding: 10px; font-family: inherit; }
        button { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 30px; font-size: 18px; margin-top: 10px; cursor: pointer; }
        .news-item { background: #f1f5f9; padding: 12px; margin: 8px 0; border-radius: 12px; border-right: 4px solid #3b82f6; }
        #result { background: #f8fafc; padding: 15px; border-radius: 12px; margin-top: 15px; display: none; white-space: pre-wrap; }
        .tabs { display: flex; gap: 10px; margin: 15px 0; }
        .tabs button { flex: 1; padding: 10px; background: #e2e8f0; border: none; border-radius: 20px; cursor: pointer; }
        .tabs .active { background: #1e293b; color: white; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🧠 امیرخوان</h1>
        <p>دستیار هوشمند رسانه</p>

        <h2>🔎 تحلیل خبر</h2>
        <textarea id="newsText" placeholder="متن خبر را وارد کن..."></textarea>
        <button id="analyzeBtn">✨ تحلیل کن</button>
        <div id="result"></div>

        <h2>📡 رادار خبری</h2>
        <div class="tabs">
            <button class="active" id="iranBtn">🇮🇷 ایران</button>
            <button id="worldBtn">🌍 جهان</button>
        </div>
        <div id="newsList"></div>
    </div>

    <script>
        // ============================
        //  داده‌های اخبار
        // ============================
        const newsData = {
            iran: [
                '🔥 قیمت دلار امروز در بازار آزاد به ۶۰,۵۰۰ تومان رسید',
                '📈 اعلام نتایج نهایی کنکور سراسری ۱۴۰۵',
                '⚠️ هشدار سطح نارنجی هواشناسی برای تهران و البرز',
                '🏛️ جلسه غیرعلنی مجلس با حضور وزیر اقتصاد',
                '📊 کاهش ۰.۵ درصدی نرخ بیکاری در فصل بهار'
            ],
            world: [
                '🌍 تشدید تنش‌ها در مرزهای اوکراین و روسیه',
                '📈 سقوط آزاد قیمت نفت در بازارهای جهانی',
                '⚠️ هشدار قرمز سازمان بهداشت درباره موج جدید کرونا',
                '🏛️ پیروزی حزب چپ در انتخابات فرانسه',
                '📊 افزایش ۲.۱ درصدی تولید ناخالص داخلی چین'
            ]
        };

        // ============================
        //  نمایش اخبار
        // ============================
        function showNews(category) {
            const list = document.getElementById('newsList');
            const items = newsData[category] || ['📭 خبری برای نمایش وجود ندارد.'];
            list.innerHTML = items.map(item => `<div class="news-item">${item}</div>`).join('');
        }

        // ============================
        //  دکمه‌های ایران و جهان
        // ============================
        document.getElementById('iranBtn').addEventListener('click', function() {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            showNews('iran');
        });

        document.getElementById('worldBtn').addEventListener('click', function() {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            showNews('world');
        });

        // ============================
        //  دکمه‌ی تحلیل
        // ============================
        document.getElementById('analyzeBtn').addEventListener('click', function() {
            const text = document.getElementById('newsText').value.trim();
            const resultDiv = document.getElementById('result');

            if (text === '') {
                alert('⚠️ لطفاً یک متن برای تحلیل وارد کن.');
                return;
            }

            const words = text.split(' ');
            let analysis = `📊 تعداد کلمات: ${words.length}\n`;
            if (text.includes('دولت') || text.includes('سیاست') || text.includes('رئیس‌جمهور')) {
                analysis += '🏛️ این خبر دارای محتوای سیاسی است.\n';
            }
            if (text.includes('دلار') || text.includes('قیمت') || text.includes('بازار')) {
                analysis += '💰 این خبر دارای محتوای اقتصادی است.\n';
            }
            if (words.length > 20) {
                analysis += '📝 این خبر نسبتاً مفصل است.\n';
            } else {
                analysis += '📝 این خبر کوتاه است.\n';
            }

            resultDiv.style.display = 'block';
            resultDiv.textContent = analysis;
        });

        // ============================
        //  بارگذاری اولیه (ایران)
        // ============================
        showNews('iran');
    </script>
</body>
</html>
