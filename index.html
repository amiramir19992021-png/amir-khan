<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیرخوان</title>
    <style>
        body {
            font-family: Tahoma;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 100px;
            border-radius: 16px;
            border: 2px solid #ddd;
            padding: 12px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
        }
        button {
            margin-top: 15px;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 16px;
            display: none;
            white-space: pre-wrap;
            font-family: Tahoma;
        }
        .news-item {
            background: #f1f5f9;
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            border-right: 4px solid #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 امیرخوان</h1>
        <p>دستیار هوشمند رسانه</p>

        <h2>🔎 تحلیل خبر</h2>
        <textarea id="newsText" placeholder="متن خبر را اینجا بنویس..."></textarea>
        <button id="analyzeBtn">✨ تحلیل کن</button>
        <div id="result"></div>

        <h2>📡 رادار خبری</h2>
        <div id="newsList">
            <div class="news-item">🔥 قیمت دلار امروز در بازار آزاد</div>
            <div class="news-item">📈 اعلام نتایج نهایی کنکور ۱۴۰۵</div>
            <div class="news-item">⚠️ هشدار سطح نارنجی هواشناسی</div>
        </div>
    </div>

    <script>
        document.getElementById('analyzeBtn').addEventListener('click', function() {
            const text = document.getElementById('newsText').value.trim();
            const resultDiv = document.getElementById('result');

            if (text === '') {
                alert('⚠️ لطفاً یک متن وارد کن.');
                return;
            }

            const words = text.split(' ');
            const wordCount = words.length;
            const hasPolitical = text.includes('دولت') || text.includes('سیاست') || text.includes('رئیس‌جمهور');
            const hasEconomic = text.includes('دلار') || text.includes('قیمت') || text.includes('بازار');

            let analysis = `📊 تعداد کلمات: ${wordCount}\n`;
            if (hasPolitical) analysis += '🏛️ این خبر دارای محتوای سیاسی است.\n';
            if (hasEconomic) analysis += '💰 این خبر دارای محتوای اقتصادی است.\n';
            if (wordCount > 20) analysis += '📝 این خبر نسبتاً مفصل است.\n';
            else analysis += '📝 این خبر کوتاه است.\n';

            resultDiv.style.display = 'block';
            resultDiv.textContent = analysis;
        });
    </script>
</body>
</html>
