<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیرخوان - سبک و سریع</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0b0d11;
            padding: 16px;
            direction: rtl;
            color: #e8edf5;
            min-height: 100vh;
        }
        .container { max-width: 820px; margin: 0 auto; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255,255,255,0.02);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.04);
            backdrop-filter: blur(18px);
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #c084fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header h1 span {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-badge {
            font-size: 11px;
            background: rgba(255,255,255,0.03);
            padding: 4px 16px;
            border-radius: 40px;
            color: rgba(255,255,255,0.2);
            letter-spacing: 1px;
        }

        .category {
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 14px 18px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .category-title {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.2);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tabs button {
            padding: 6px 16px;
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 40px;
            background: rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .tabs button:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }
        .tabs button.active {
            background: rgba(99,102,241,0.15);
            border-color: rgba(99,102,241,0.3);
            color: #a5b4fc;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .news-card {
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,0.03);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .news-card:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.06);
            transform: translateY(-2px);
        }
        .news-card .title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.5;
            color: #f1f5f9;
            margin-bottom: 4px;
        }
        .news-card .snippet {
            font-size: 13px;
            color: rgba(255,255,255,0.35);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .news-card .meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            font-size: 11px;
            color: rgba(255,255,255,0.15);
        }
        .news-card .meta .source {
            color: rgba(255,255,255,0.25);
            font-weight: 500;
        }
        .news-card .expanded {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .news-card .expanded.show {
            display: block;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .news-card .expanded .full-text {
            font-size: 13px;
            line-height: 1.8;
            color: rgba(255,255,255,0.5);
        }
        .news-card .expanded .full-text .original {
            background: rgba(255,255,255,0.02);
            padding: 8px 12px;
            border-radius: 12px;
            margin-top: 4px;
            border-right: 2px solid rgba(99,102,241,0.15);
        }
        .news-card .expanded .read-more {
            display: inline-block;
            margin-top: 10px;
            color: #818cf8;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            border-bottom: 1px solid transparent;
            transition: 0.2s;
        }
        .news-card .expanded .read-more:hover {
            border-bottom-color: #818cf8;
        }
        .translation-badge {
            font-size: 9px;
            background: rgba(99,102,241,0.12);
            color: #a5b4fc;
            padding: 2px 10px;
            border-radius: 40px;
            margin-right: 6px;
            border: 1px solid rgba(99,102,241,0.08);
        }

        .analysis-box {
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .analysis-box h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #a5b4fc;
        }
        .analysis-box textarea {
            width: 100%;
            height: 70px;
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            color: #e8edf5;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            resize: vertical;
        }
        .analysis-box textarea:focus {
            outline: none;
            border-color: rgba(99,102,241,0.15);
        }
        .analysis-box button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 40px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        .analysis-box button:hover {
            transform: scale(1.01);
            box-shadow: 0 8px 30px rgba(99,102,241,0.1);
        }
        #result {
            margin-top: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 14px;
            display: none;
            font-size: 13px;
            line-height: 1.8;
            color: rgba(255,255,255,0.5);
        }
        #result .label { color: #a5b4fc; font-weight: 600; }
        .sentiment-positive { color: #34d399; }
        .sentiment-negative { color: #f87171; }
        .sentiment-neutral { color: #fbbf24; }
        .loading {
            text-align: center;
            color: rgba(255,255,255,0.1);
            padding: 30px 0;
            font-weight: 300;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🧠 <span>امیر</span>خوان</h1>
        <div class="header-badge">✦ سریع</div>
    </div>

    <div class="category">
        <div class="category-title">🇮🇷 داخلی</div>
        <div class="tabs" id="internalTabs">
            <button class="active" data-url="https://www.irna.ir/rss" data-lang="fa">ایرنا</button>
            <button data-url="https://www.mehrnews.com/rss" data-lang="fa">مهر</button>
            <button data-url="https://www.imna.ir/rss" data-lang="fa">ایمنا</button>
            <button data-url="https://www.donya-e-eqtesad.com/rss" data-lang="fa">دنیای اقتصاد</button>
        </div>
    </div>

    <div class="category">
        <div class="category-title">🌍 خارجی</div>
        <div class="tabs" id="externalTabs">
            <button data-url="https://www.rt.com/rss" data-lang="en">راشا تودی</button>
            <button data-url="https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml" data-lang="en">نیویورک تایمز</button>
            <button data-url="https://www.theguardian.com/world/rss" data-lang="en">گاردین</button>
            <button data-url="https://feeds.washingtonpost.com/rss/world" data-lang="en">واشنگتن پست</button>
            <button data-url="https://www.nbcnews.com/feed" data-lang="en">ان‌بی‌سی</button>
            <button data-url="https://www.cnbc.com/id/100003114/device/rss/rss.html" data-lang="en">سی‌ان‌بی‌سی</button>
            <button data-url="https://feeds.bloomberg.com/markets/news.rss" data-lang="en">بلومبرگ</button>
        </div>
    </div>

    <div class="news-list" id="newsList"><div class="loading">⏳ انتخاب کنید...</div></div>

    <div class="analysis-box">
        <h3>🔎 تحلیل هوشمند</h3>
        <textarea id="newsText" placeholder="متن خبر را برای تحلیل وارد کن..."></textarea>
        <button id="analyzeBtn">🧠 تحلیل کامل</button>
        <div id="result"></div>
    </div>
</div>

<script>
// ================================
//  ترجمه
// ================================
async function translateText(text, fromLang) {
    if (fromLang === 'fa' || !text || text.length < 2) return text;
    try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${fromLang}&tl=fa&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        const data = await response.json();
        if (data && data[0]) return data[0].map(item => item[0]).join('');
        return text;
    } catch { return text; }
}

// ================================
//  تحلیل
// ================================
function analyzeNews(text) {
    const words = text.split(/\s+/);
    const wordCount = words.length;
    const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
    const sentenceCount = sentences.length;
    const avgSentenceLength = wordCount / sentenceCount;

    let positiveWords = ['خوب','عالی','بهبود','افزایش','پیروزی','موفق','امید','رشد','افتخار','قوی'];
    let negativeWords = ['بد','وحشت','کاهش','شکست','خطر','بحران','مرگ','آسیب','تحریم','جنگ','تورم'];
    let positiveCount=0, negativeCount=0;
    words.forEach(w => {
        if(positiveWords.some(p => w.includes(p))) positiveCount++;
        if(negativeWords.some(n => w.includes(n))) negativeCount++;
    });
    let sentiment='خنثی', sentimentEmoji='😐';
    if(positiveCount > negativeCount+2){ sentiment='مثبت'; sentimentEmoji='😊'; }
    else if(negativeCount > positiveCount+2){ sentiment='منفی'; sentimentEmoji='😞'; }

    let topics=[];
    if(text.includes('دولت')||text.includes('سیاست')||text.includes('رئیس‌جمهور')||text.includes('مجلس')) topics.push('سیاسی');
    if(text.includes('دلار')||text.includes('قیمت')||text.includes('بازار')||text.includes('اقتصاد')||text.includes('سهام')) topics.push('اقتصادی');
    if(text.includes('فوتبال')||text.includes('ورزش')||text.includes('بازی')||text.includes('المپیک')) topics.push('ورزشی');
    if(text.includes('فناوری')||text.includes('رایانه')||text.includes('هوش مصنوعی')||text.includes('اینترنت')) topics.push('فناوری');
    if(text.includes('سلامت')||text.includes('درمان')||text.includes('بیمارستان')||text.includes('کرونا')) topics.push('سلامت');
    if(text.includes('فیلم')||text.includes('موسیقی')||text.includes('هنر')||text.includes('کتاب')) topics.push('فرهنگی');
    if(topics.length===0) topics.push('عمومی');

    const wordFreq={};
    words.forEach(w=>{ if(w.length>3) wordFreq[w]=(wordFreq[w]||0)+1; });
    const sortedWords=Object.entries(wordFreq).sort((a,b)=>b[1]-a[1]);
    const keywords=sortedWords.slice(0,5).map(item=>item[0]);

    const summary=words.slice(0,50).join(' ')+(words.length>50?'...':'');

    let credibilityScore=5;
    if(sentenceCount>3) credibilityScore+=1;
    if(wordCount>50) credibilityScore+=1;
    if(text.includes('منبع')||text.includes('گزارش')||text.includes('طبق')) credibilityScore+=1;
    if(text.includes('ادعا')||text.includes('شایعه')||text.includes('گمانه')) credibilityScore-=2;
    credibilityScore=Math.min(10,Math.max(0,credibilityScore));

    let categorySuggestion='';
    if(topics.includes('سیاسی')) categorySuggestion='سیاسی';
    else if(topics.includes('اقتصادی')) categorySuggestion='اقتصادی';
    else if(topics.includes('ورزشی')) categorySuggestion='ورزشی';
    else if(topics.includes('فناوری')) categorySuggestion='فناوری';
    else if(topics.includes('سلامت')) categorySuggestion='سلامت';
    else categorySuggestion='عمومی';

    return { wordCount, sentenceCount, avgSentenceLength, sentiment, sentimentEmoji, topics, keywords, summary, credibilityScore, categorySuggestion };
}

function displayAnalysis(result) {
    const div = document.getElementById('result');
    const sentimentClass = result.sentiment==='مثبت'?'sentiment-positive':result.sentiment==='منفی'?'sentiment-negative':'sentiment-neutral';
    div.innerHTML = `
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px;">
            <div><span class="label">📊 کلمات:</span> ${result.wordCount}</div>
            <div><span class="label">📝 جملات:</span> ${result.sentenceCount}</div>
            <div><span class="label">📏 میانگین جمله:</span> ${result.avgSentenceLength.toFixed(1)}</div>
            <div><span class="label">😊 احساسات:</span> <span class="${sentimentClass}">${result.sentimentEmoji} ${result.sentiment}</span></div>
            <div style="grid-column:span 2;"><span class="label">🏷️ موضوعات:</span> ${result.topics.join('، ')}</div>
            <div style="grid-column:span 2;"><span class="label">🔑 کلمات کلیدی:</span> ${result.keywords.join('، ')}</div>
            <div style="grid-column:span 2;"><span class="label">📌 خلاصه:</span> ${result.summary}</div>
            <div style="grid-column:span 2;"><span class="label">✅ اعتبار:</span> ${result.credibilityScore}/10</div>
            <div style="grid-column:span 2;"><span class="label">📂 دسته‌بندی:</span> ${result.categorySuggestion}</div>
        </div>
    `;
    div.style.display='block';
}

// ================================
//  دریافت اخبار
// ================================
async function fetchNews(rssUrl, fromLang) {
    const container = document.getElementById('newsList');
    container.innerHTML = '<div class="loading">⏳ در حال بارگذاری...</div>';
    try {
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
        const response = await fetch(apiUrl);
        const data = await response.json();
        if (!data.items || data.items.length === 0) {
            container.innerHTML = '<div class="loading">📭 خبری برای نمایش وجود ندارد.</div>';
            return;
        }
        const items = data.items.slice(0, 10);
        let html = '';
        for (const item of items) {
            const link = item.link || '#';
            const title = item.title || 'بدون عنوان';
            const description = item.description || item.content || '';
            const cleanDesc = description.replace(/<[^>]*>/g, '').trim();
            const snippet = cleanDesc.length > 120 ? cleanDesc.substring(0,120)+'...' : cleanDesc;
            const translatedTitle = await translateText(title, fromLang);
            const translatedSnippet = await translateText(snippet, fromLang);
            const isForeign = fromLang !== 'fa';

            html += `
                <div class="news-card" data-link="${link}">
                    <div class="title">${isForeign ? translatedTitle : title} ${isForeign ? '<span class="translation-badge">۲ زبانه</span>' : ''}</div>
                    <div class="snippet">${isForeign ? translatedSnippet : snippet}</div>
                    <div class="meta"><span class="source">${isForeign ? '🌍 خارجی' : '🇮🇷 داخلی'}</span> <span>📌 کلیک کنید</span></div>
                    <div class="expanded">
                        <div class="full-text">
                            ${isForeign ? `
                                <div style="background:rgba(255,255,255,0.02); padding:8px 12px; border-radius:12px; margin-bottom:4px; border-right:2px solid rgba(99,102,241,0.15);">
                                    <div style="font-size:11px; color:rgba(255,255,255,0.2);">🇬🇧 اصلی</div>
                                    <div style="font-size:14px; color:rgba(255,255,255,0.6);">${title}</div>
                                    <div style="font-size:12px; color:rgba(255,255,255,0.3);">${snippet}</div>
                                </div>
                                <div style="background:rgba(99,102,241,0.04); padding:8px 12px; border-radius:12px; border-right:2px solid rgba(251,191,36,0.15);">
                                    <div style="font-size:11px; color:rgba(255,255,255,0.2);">🇮🇷 ترجمه</div>
                                    <div style="font-size:14px; color:rgba(255,255,255,0.7);">${translatedTitle}</div>
                                    <div style="font-size:12px; color:rgba(255,255,255,0.3);">${translatedSnippet}</div>
                                </div>
                            ` : `<div>📖 ${snippet}</div>`}
                        </div>
                        <a href="${link}" target="_blank" class="read-more">🔗 مطالعه‌ی کامل در منبع</a>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;

        document.querySelectorAll('.news-card').forEach(card => {
            card.addEventListener('click', function(e) {
                if (e.target.tagName === 'A') return;
                const expanded = this.querySelector('.expanded');
                const isOpen = expanded.classList.contains('show');
                document.querySelectorAll('.news-card .expanded').forEach(el => el.classList.remove('show'));
                if (!isOpen) {
                    expanded.classList.add('show');
                    setTimeout(() => this.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
                }
            });
        });

    } catch (error) {
        container.innerHTML = '<div class="loading">⚠️ خطا در دریافت اخبار</div>';
    }
}

// ================================
//  دکمه‌ها
// ================================
function setupTabs(selector) {
    document.querySelectorAll(selector).forEach(btn => {
        btn.addEventListener('click', function() {
            const parent = this.closest('.tabs');
            parent.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            fetchNews(this.dataset.url, this.dataset.lang || 'en');
        });
    });
}
setupTabs('#internalTabs button');
setupTabs('#externalTabs button');

document.getElementById('analyzeBtn').addEventListener('click', function() {
    const text = document.getElementById('newsText').value.trim();
    if (!text) { alert('⚠️ لطفاً یک متن وارد ک
