<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیرخوان - منحصربه‌فرد</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f4f8;
            padding: 16px;
            direction: rtl;
            color: #1e293b;
            transition: background 0.3s, color 0.3s;
        }
        body.dark-mode {
            background: #0f172a;
            color: #e2e8f0;
        }
        body.dark-mode .header,
        body.dark-mode .category,
        body.dark-mode .news-card,
        body.dark-mode .analysis-box {
            background: #1e293b;
            color: #e2e8f0;
        }
        body.dark-mode .tabs button {
            background: #334155;
            color: #cbd5e1;
        }
        body.dark-mode .tabs button.active {
            background: #6366f1;
            color: #fff;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .header {
            background: #ffffff;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-bottom: 3px solid #2563eb;
            transition: 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 { font-size: 26px; color: #2563eb; }
        .header h1 span { color: #1e40af; }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .header-actions button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #2563eb;
        }
        .category {
            background: #ffffff;
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: 0.3s;
        }
        .category-title {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tabs button {
            padding: 6px 14px;
            border: none;
            border-radius: 30px;
            background: #f1f5f9;
            color: #334155;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tabs button:hover { background: #e2e8f0; }
        .tabs button.active {
            background: #2563eb;
            color: #fff;
        }
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .news-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-right: 4px solid #2563eb;
            transition: 0.3s;
            cursor: pointer;
        }
        .news-card:hover {
            box-shadow: 0 4px 16px rgba(37,99,235,0.08);
        }
        .news-card .title {
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .news-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 12px;
            color: #64748b;
            margin: 6px 0 4px;
        }
        .news-card .importance-bar {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            margin: 4px 0;
        }
        .news-card .importance-bar .fill {
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
            transition: 0.5s;
        }
        .news-card .snippet {
            font-size: 13px;
            color: #475569;
            line-height: 1.6;
            margin-top: 2px;
        }
        .news-card .summary-box {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            border-right: 3px solid #2563eb;
            font-size: 13px;
            line-height: 1.8;
            color: #1e293b;
        }
        .news-card .summary-box.show { display: block; }
        .news-card .summary-box .summary-title {
            font-weight: 600;
            color: #2563eb;
            margin-bottom: 4px;
        }
        .news-card .summary-box .read-more {
            display: inline-block;
            margin-top: 8px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
        }
        .news-card .summary-box .translate-link {
            display: inline-block;
            margin-top: 6px;
            color: #16a34a;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            background: #f0fdf4;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #bbf7d0;
        }
        .news-card .summary-box .translate-link:hover {
            background: #dcfce7;
        }
        .news-card .summary-box .play-summary {
            display: inline-block;
            margin-top: 6px;
            color: #7c3aed;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            background: #f5f3ff;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #ddd6fe;
            cursor: pointer;
        }
        .news-card .summary-box .play-summary:hover {
            background: #ede9fe;
        }
        .share-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e2e8f0;
        }
        .share-buttons .share-label {
            font-size: 11px;
            color: #94a3b8;
            margin-left: 8px;
            align-self: center;
        }
        .share-buttons a {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            color: #fff;
            transition: 0.2s;
        }
        .share-buttons a:hover { transform: scale(1.02); }
        .share-telegram { background: #0088cc; }
        .share-whatsapp { background: #25d366; }
        .share-twitter { background: #1da1f2; }
        .share-ita { background: #2e7d32; }
        .share-bale { background: #f9a825; color: #1e293b; }
        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 30px 0;
        }
        .analysis-box {
            background: #ffffff;
            border-radius: 14px;
            padding: 16px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: 0.3s;
        }
        .analysis-box h3 { color: #2563eb; margin-bottom: 8px; }
        .analysis-box textarea {
            width: 100%;
            height: 70px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px;
            background: #f8fafc;
            color: #0f172a;
            font-family: Tahoma, sans-serif;
            resize: vertical;
        }
        .analysis-box textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .analysis-box button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 30px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .analysis-box button:hover { background: #1d4ed8; }
        #result {
            margin-top: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            display: none;
            font-size: 13px;
            line-height: 1.8;
            color: #1e293b;
            border: 1px solid #e2e8f0;
        }
        #result .label { color: #2563eb; font-weight: 600; }
        .sentiment-positive { color: #16a34a; }
        .sentiment-negative { color: #dc2626; }
        .sentiment-neutral { color: #eab308; }
        .no-news {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px dashed #e2e8f0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🧠 <span>امیر</span>خوان</h1>
        <div class="header-actions">
            <button id="readModeBtn" title="حالت مطالعه">📖</button>
            <button id="themeToggle" title="تغییر تم">🌙</button>
        </div>
    </div>

    <div class="category">
        <div class="category-title">🇮🇷 داخلی</div>
        <div class="tabs" id="internalTabs">
            <button class="active" data-url="https://www.irna.ir/rss" data-lang="fa" data-color="#2563eb">ایرنا</button>
            <button data-url="https://www.mehrnews.com/rss" data-lang="fa" data-color="#16a34a">مهر</button>
            <button data-url="https://www.imna.ir/rss" data-lang="fa" data-color="#7c3aed">ایمنا</button>
            <button data-url="https://www.donya-e-eqtesad.com/rss" data-lang="fa" data-color="#f59e0b">دنیای اقتصاد</button>
        </div>
    </div>

    <div class="category">
        <div class="category-title">🌍 خارجی و علمی</div>
        <div class="tabs" id="externalScienceTabs">
            <button data-url="https://www.rt.com/rss" data-lang="en" data-color="#dc2626">راشا تودی</button>
            <button data-url="https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml" data-lang="en" data-color="#1a0dab">نیویورک تایمز</button>
            <button data-url="https://www.theguardian.com/world/rss" data-lang="en" data-color="#052962">گاردین</button>
            <button data-url="https://www.sciencedaily.com/rss/all.xml" data-lang="en" data-color="#0284c7">ساینس‌دیلی</button>
        </div>
    </div>

    <div class="news-list" id="newsList">
        <div class="loading">⏳ انتخاب کنید...</div>
    </div>

    <div class="analysis-box">
        <h3>🔎 تحلیل خبر</h3>
        <textarea id="newsText" placeholder="متن خبر را برای تحلیل وارد کن..."></textarea>
        <button id="analyzeBtn">🧠 تحلیل کن</button>
        <div id="result"></div>
    </div>
</div>

<script>
// ================================
//  حالت مطالعه
// ================================
let readMode = false;
document.getElementById('readModeBtn').addEventListener('click', function() {
    readMode = !readMode;
    document.querySelectorAll('.news-card .snippet, .news-card .meta').forEach(el => {
        el.style.display = readMode ? 'none' : 'block';
    });
    document.querySelectorAll('.news-card .title').forEach(el => {
        el.style.fontSize = readMode ? '20px' : '15px';
        el.style.lineHeight = readMode ? '2' : '1.5';
    });
    this.textContent = readMode ? '📖 (فعال)' : '📖';
});

// ================================
//  تم شب/روز هوشمند
// ================================
const themeToggle = document.getElementById('themeToggle');
let darkMode = localStorage.getItem('amirkhan-theme') === 'dark';
if (darkMode) {
    document.body.classList.add('dark-mode');
    themeToggle.textContent = '☀️';
}
themeToggle.addEventListener('click', function() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('amirkhan-theme', isDark ? 'dark' : 'light');
    this.textContent = isDark ? '☀️' : '🌙';
});

// بررسی خودکار ساعت
const hour = new Date().getHours();
if (hour < 6 || hour > 18) {
    document.body.classList.add('dark-mode');
    themeToggle.textContent = '☀️';
}

// ================================
//  تحلیل خبر
// ================================
function analyzeNews(text) {
    const words = text.split(/\s+/);
    const wordCount = words.length;
    const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
    const sentenceCount = sentences.length;

    let positiveWords = ['خوب','عالی','بهبود','افزایش','پیروزی','موفق','امید','رشد','افتخار','قوی'];
    let negativeWords = ['بد','وحشت','کاهش','شکست','خطر','بحران','مرگ','آسیب','تحریم','جنگ','تورم'];
    let positiveCount=0, negativeCount=0;
    words.forEach(w => {
        if(positiveWords.some(p => w.includes(p))) positiveCount++;
        if(negativeWords.some(n => w.includes(n))) negativeCount++;
    });
    let sentiment='خنثی', sentimentEmoji='😐';
    if(positiveCount > negativeCount+2){ sentiment='مثبت'; sentimentEmoji='😊'; }
    else if(negativeCount > positiveCount+2){ sentiment='منفی'; sentimentEmoji='😞'; }

    let topics=[];
    if(text.includes('دولت')||text.includes('سیاست')||text.includes('رئیس‌جمهور')) topics.push('سیاسی');
    if(text.includes('دلار')||text.includes('قیمت')||text.includes('بازار')||text.includes('اقتصاد')) topics.push('اقتصادی');
    if(text.includes('فوتبال')||text.includes('ورزش')) topics.push('ورزشی');
    if(text.includes('فناوری')||text.includes('رایانه')||text.includes('هوش مصنوعی')) topics.push('فناوری');
    if(text.includes('سلامت')||text.includes('درمان')||text.includes('بیمارستان')) topics.push('سلامت');
    if(topics.length===0) topics.push('عمومی');

    const wordFreq={};
    words.forEach(w=>{ if(w.length>3) wordFreq[w]=(wordFreq[w]||0)+1; });
    const sortedWords=Object.entries(wordFreq).sort((a,b)=>b[1]-a[1]);
    const keywords=sortedWords.slice(0,5).map(item=>item[0]);

    const summary=words.slice(0,50).join(' ')+(words.length>50?'...':'');

    let credibilityScore=5;
    if(sentenceCount>3) credibilityScore+=1;
    if(wordCount>50) credibilityScore+=1;
    if(text.includes('منبع')||text.includes('گزارش')) credibilityScore+=1;
    if(text.includes('ادعا')||text.includes('شایعه')) credibilityScore-=2;
    credibilityScore=Math.min(10,Math.max(0,credibilityScore));

    return { wordCount, sentenceCount, sentiment, sentimentEmoji, topics, keywords, summary, credibilityScore };
}

function displayAnalysis(result) {
    const div = document.getElementById('result');
    const sentimentClass = result.sentiment==='مثبت'?'sentiment-positive':result.sentiment==='منفی'?'sentiment-negative':'sentiment-neutral';
    div.innerHTML = `
        <div><span class="label">📊 کلمات:</span> ${result.wordCount}</div>
        <div><span class="label">📝 جملات:</span> ${result.sentenceCount}</div>
        <div><span class="label">😊 احساسات:</span> <span class="${sentimentClass}">${result.sentimentEmoji} ${result.sentiment}</span></div>
        <div><span class="label">🏷️ موضوعات:</span> ${result.topics.join('، ')}</div>
        <div><span class="label">🔑 کلمات کلیدی:</span> ${result.keywords.join('، ')}</div>
        <div><span class="label">📌 خلاصه:</span> ${result.summary}</div>
        <div><span class="label">✅ اعتبار:</span> ${result.credibilityScore}/10</div>
    `;
    div.style.display='block';
}

// ================================
//  پخش خلاصه خبر با صدا
// ================================
function playSummary(text) {
    if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fa-IR';
        utterance.rate = 0.9;
        speechSynthesis.speak(utterance);
    } else {
        alert('⚠️ مرورگر شما از این قابلیت پشتیبانی نمی‌کند.');
    }
}

// ================================
//  دریافت اخبار
// ================================
async function fetchNews(rssUrl, fromLang) {
    const container = document.getElementById('newsList');
    container.innerHTML = '<div class="loading">⏳ در حال بارگذاری...</div>';
    try {
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (!data.items || data.items.length === 0) {
            container.innerHTML = '<div class="no-news">📭 خبری برای نمایش وجود ندارد.</div>';
            return;
        }

        const isForeign = fromLang !== 'fa';
        const items = data.items.slice(0, 10);
        let html = '';

        for (const item of items) {
            const link = item.link || '#';
            const title = item.title || 'بدون عنوان';
            
            let summary = '';
            if (item.description) {
                summary = item.description.replace(/<[^>]*>/g, '').trim();
            } else if (item.content) {
                summary = item.content.replace(/<[^>]*>/g, '').trim();
            } else if (item.title) {
                summary = item.title;
            }
            if (!summary || summary.length < 5) summary = title;
            
            const shortSummary = summary.length > 120 ? summary.substring(0, 120) + '...' : summary;

            let timeAgo = '';
            if (item.pubDate) {
                try {
                    const date = new Date(item.pubDate);
                    const now = new Date();
                    const diffMs = now - date;
                    const diffMins = Math.floor(diffMs / 60000);
                    const diffHours = Math.floor(diffMins / 60);
                    const diffDays = Math.floor(diffHours / 24);
                    if (diffDays > 0) timeAgo = `${diffDays} روز پیش`;
                    else if (diffHours > 0) timeAgo = `${diffHours} ساعت پیش`;
                    else if (diffMins > 0) timeAgo = `${diffMins} دقیقه پیش`;
                    else timeAgo = 'لحظاتی پیش';
                } catch { timeAgo = ''; }
            }

            // محاسبه اهمیت خبر (بر اساس طول متن و زمان)
            const importance = Math.min(100, Math.floor((summary.length / 10) + (Math.random() * 20)));

            const shareText = encodeURIComponent(title);
            const shareUrl = encodeURIComponent(link);
            const telegramLink = `https://t.me/share/url?url=${shareUrl}&text=${shareText}`;
            const whatsappLink = `https://api.whatsapp.com/send?text=${shareText}%20${shareUrl}`;
            const twitterLink = `https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}`;
            const itaLink = `https://ita.ir/#!/share?url=${shareUrl}&text=${shareText}`;
            const baleLink = `https://bale.ai/#!/share?url=${shareUrl}&text=${shareText}`;

            html += `
                <div class="news-card" data-link="${link}">
                    <div class="title">📰 ${title}</div>
                    <div class="meta">
                        <span>🕒 ${timeAgo || 'تاریخ نامشخص'}</span>
                        <span>⭐ اهمیت: ${importance}%</span>
                    </div>
                    <div class="importance-bar"><div class="fill" style="width:${importance}%"></div></div>
                    <div class="snippet">${shortSummary}</div>
                    <div class="summary-box">
                        <div class="summary-title">📌 خلاصه خبر</div>
                        <div>${summary}</div>
                        ${isForeign ? `
                            <div style="margin-top:8px;">
                                <a href="https://translate.google.com/translate?sl=en&tl=fa&u=${encodeURIComponent(link)}" target="_blank" class="translate-link">🌐 ترجمه با گوگل</a>
                            </div>
