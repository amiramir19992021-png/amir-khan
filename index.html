<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیرخوان - اخبار نمونه</title>
    <style>
        body { font-family: Tahoma; background: #f0f2f5; padding: 20px; margin: 0; direction: rtl; }
        .container { max-width: 700px; margin: auto; background: white; border-radius: 30px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 80px; border-radius: 16px; border: 2px solid #ddd; padding: 12px; font-family: inherit; box-sizing: border-box; }
        button { margin-top: 12px; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; }
        #result { margin-top: 20px; padding: 15px; background: #f8fafc; border-radius: 16px; display: none; white-space: pre-wrap; }
        .tabs { display: flex; gap: 10px; margin: 15px 0; }
        .tabs button { flex: 1; padding: 12px; border: none; border-radius: 30px; background: #e2e8f0; font-weight: bold; cursor: pointer; }
        .tabs .active { background: #1e293b; color: white; }
        .news-item { background: #f1f5f9; padding: 12px; margin: 8px 0; border-radius: 12px; border-right: 4px solid #3b82f6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 امیرخوان</h1>
        <p>دستیار هوشمند رسانه</p>

        <h2>🔎 تحلیل خبر</h2>
        <textarea id="newsText" placeholder="متن خبر را وارد کن..."></textarea>
        <button id="analyzeBtn">✨ تحلیل کن</button>
        <div id="result"></div>

        <h2>📡 رادار خبری</h2>
        <div class="tabs">
            <button id="iranTab" class="active">🇮🇷 ایران</button>
            <button id="worldTab">🌍 جهان</button>
        </div>
        <div id="newsList"></div>
    </div>

    <script>
        // ============================
        // داده‌های اخبار نمونه
        // ============================
        const newsData = {
            iran: [
                '🔥 قیمت دلار امروز در بازار آزاد به ۶۰ هزار تومان رسید',
                '📈 اعلام نتایج نهایی کنکور سراسری ۱۴۰۵',
                '⚠️ هشدار سطح نارنجی هواشناسی برای تهران و استان‌های شمالی',
                '🏛️ نشست خبری سخنگوی دولت درباره بودجه سال آینده',
                '📊 نرخ بیکاری در کشور به ۸.۵ درصد کاهش یافت'
            ],
            world: [
                '🌍 تنش‌های جدید در مرزهای اوکراین و روسیه',
                '📈 قیمت نفت به بالاترین سطح در ۳ ماه اخیر رسید',
                '⚠️ هشدار سازمان بهداشت جهانی درباره شیوع آبله میمون',
                '🏛️ انتخابات ریاست‌جمهوری در فرانسه وارد مرحله‌ی دوم شد',
                '📊 گزارش جدید از رشد اقتصادی چین در سه ماهه‌ی اول'
            ]
        };

        // ============================
        // نمایش اخبار
        // ============================
        function showNews(category) {
            const list = document.getElementById('newsList');
            const items = newsData[category];
            list.innerHTML = items.map(item => `<div class="news-item">${item}</div>`).join('');
        }

        // ============================
        // دکمه‌های ایران و جهان
        // ============================
        document.getElementById('iranTab').addEventListener('click', function() {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            showNews('iran');
        });

        document.getElementById('worldTab').addEventListener('click', function() {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            showNews('world');
        });

        // ============================
        // تحلیل خبر
        // ============================
        document.getElementById('analyzeBtn').addEventListener('click', function() {
            const text = document.getElementById('newsText').value.trim();
            const resultDiv = document.getElementById('result');
            if (text === '') {
                alert('⚠️ لطفاً یک متن وارد کن.');
                return;
            }
            const words = text.split(' ');
            let analysis = `📊 تعداد کلمات: ${words.length}\n`;
            if (text.includes('دولت') || text.includes('سیاست') || text.includes('رئیس‌جمهور')) 
                analysis += '🏛️ این خبر دارای محتوای سیاسی است.\n';
            if (text.includes('دلار') || text.includes('قیمت') || text.includes('بازار')) 
                analysis += '💰 این خبر دارای محتوای اقتصادی است.\n';
            if (words.length > 20) 
                analysis += '📝 این خبر نسبتاً مفصل است.\n';
            else 
                analysis += '📝 این خبر کوتاه است.\n';
            
            resultDiv.style.display = 'block';
            resultDiv.textContent = analysis;
        });

        // ============================
        // بارگذاری اولیه (ایران)
        // ============================
        showNews('iran');
    </script>
</body>
</html>
