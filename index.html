<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیرخوان - با حالت شب و روز</title>
    <style>

        body {
            font-family: Tahoma, sans-serif;
            background: #f0f4f8;
            padding: 16px;
            direction: rtl;
            color: #1e293b;
            transition: background 0.3s, color 0.3s;
        }
        .container { max-width: 700px; margin: 0 auto; }

        /* ===== تم روشن (پیش‌فرض) ===== */
        .header {
            background: #ffffff;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-bottom: 3px solid #2563eb;
            transition: 0.3s;
        }
        .header h1 { font-size: 26px; color: #2563eb; }
        .header h1 span { color: #1e40af; }
        .category {
            background: #ffffff;
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: 0.3s;
        }
        .category-title {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tabs button {
            padding: 6px 12px;
            border: none;
            border-radius: 30px;
            background: #f1f5f9;
            color: #334155;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tabs button:hover { background: #e2e8f0; }
        .tabs button.active {
            background: #2563eb;
            color: #fff;
        }
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .news-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-right: 4px solid #2563eb;
            transition: 0.3s;
            cursor: pointer;

        .news-card:hover {
            box-shadow: 0 4px 16px rgba(37,99,235,0.08);
        }
        .news-card .title {
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .news-card .snippet {
            font-size: 13px;
            color: #475569;
            line-height: 1.6;
            margin-top: 2px;
        }
        .news-card .summary-box {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            border-right: 3px solid #2563eb;
            font-size: 13px;
            line-height: 1.8;
            color: #1e293b;
        }
        .news-card .summary-box.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .news-card .summary-box .summary-title {
            font-weight: 600;
            color: #2563eb;
            margin-bottom: 4px;
        }
        .news-card .summary-box .read-more {
            display: inline-block;
            margin-top: 8px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
        }
        .news-card .summary-box .read-more:hover {
            text-decoration: underline;
        }
        .news-card .summary-box .translate-link {
            display: inline-block;
            margin-top: 6px;
            color: #16a34a;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            background: #f0fdf4;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #bbf7d0;
        }
        .news-card .summary-box .translate-link:hover {
            background: #dcfce7;
        }
        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 30px 0;
        }
        .analysis-box {
            background: #ffffff;
            border-radius: 14px;
            padding: 16px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: 0.3s;
        }
        .analysis-box h3 { color: #2563eb; margin-bottom: 8px; }
        .analysis-box textarea {
            width: 100%;
            height: 70px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px;
            background: #f8fafc;
            color: #0f172a;
            font-family: Tahoma, sans-serif;
            resize: vertical;
        }
        .analysis-box textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .analysis-box button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 30px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .analysis-box button:hover { background: #1d4ed8; }
        #result {
            margin-top: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            display: none;
            font-size: 13px;
            line-height: 1.8;
            color: #1e293b;
            border: 1px solid #e2e8f0;
        }
        #result .label { color: #2563eb; font-weight: 600; }
        .sentiment-positive { color: #16a34a; }
        .sentiment-negative { color: #dc2626; }
        .sentiment-neutral { color: #eab308; }
        .no-news {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px dashed #e2e8f0;
        }
        .theme-toggle {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 0 10px;
            color: #2563eb;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ===== تم تیره (Dark Mode) ===== */
        body.dark-mode {
            background: #0f172a;
            color: #e2e8f0;
        }
        body.dark-mode .header {
            background: #1e293b;
            border-bottom-color: #3b82f6;
        }
        body.dark-mode .header h1 { color: #60a5fa; }
        body.dark-mode .header h1 span { color: #93c5fd; }
        body.dark-mode .category {

        }
        body.dark-mode .news-card {
            background: #1e293b;

        }
        body.dark-mode .news-card .title {
            color: #f1f5f9;
        }
        body.dark-mode .news-card .snippet {
            color: #94a3b8;
        }
        body.dark-mode .news-card .summary-box {
            background: #0f172a;
            color: #e2e8f0;
        }
        body.dark-mode .news-card .summary-box .summary-title {
            color: #60a5fa;
        }
        body.dark-mode .news-card .summary-box .read-more {
            color: #60a5fa;
        }
        body.dark-mode .news-card .summary-box .translate-link {
            background: #172554;

            color: #60a5fa;

        body.dark-mode .analysis-box {

        body.dark-mode .analysis-box textarea {
            background: #0f172a;
            border-color: #334155;
            color: #e2e8f0;
        }
        body.dark-mode .analysis-box textarea:focus {
            border-color: #3b82f6;

        }

        }
        body.dark-mode .loading {

        }
    </style>
</head>

<script>
// ================================
//  حالت شب/روز
// ================================
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('themeToggle');
    const currentTheme = localStorage.getItem('amirkhan-theme') || 'light';
    
    if (currentTheme === 'dark') {
        document.body.classList.add('dark-mode');
        toggleBtn.textContent = '☀️';
    }

    toggleBtn.addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        this.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('amirkhan-theme', isDark ? 'dark' : 'light');
    });
});

// ================================
//  تحلیل خبر
// ================================
function analyzeNews(text) {
    const words = text.split(/\s+/);
    const wordCount = words.length;
    const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
    const sentenceCount = sentences.length;

    let positiveWords = ['خوب','عالی','بهبود','افزایش','پیروزی','موفق','امید','رشد','افتخار','قوی'];
    let negativeWords = ['بد','وحشت','کاهش','شکست','خطر','بحران','مرگ','آسیب','تحریم','جنگ','تورم'];
    let positiveCount=0, negativeCount=0;
    words.forEach(w => {
        if(positiveWords.some(p => w.includes(p))) positiveCount++;
        if(negativeWords.some(n => w.includes(n))) negativeCount++;
    });
    let sentiment='خنثی', sentimentEmoji='😐';
    if(positiveCount > negativeCount+2){ sentiment='مثبت'; sentimentEmoji='😊'; }
    else if(negativeCount > positiveCount+2){ sentiment='منفی'; sentimentEmoji='😞'; }

    let topics=[];
    if(text.includes('دولت')||text.includes('سیاست')||text.includes('رئیس‌جمهور')) topics.push('سیاسی');
    if(text.includes('دلار')||text.includes('قیمت')||text.includes('بازار')||text.includes('اقتصاد')) topics.push('اقتصادی');
    if(text.includes('فوتبال')||text.includes('ورزش')) topics.push('ورزشی');
    if(text.includes('فناوری')||text.includes('رایانه')||text.includes('هوش مصنوعی')) topics.push('فناوری');
    if(text.includes('سلامت')||text.includes('درمان')||text.includes('بیمارستان')) topics.push('سلامت');
    if(topics.length===0) topics.push('عمومی');

    const wordFreq={};
    words.forEach(w=>{ if(w.length>3) wordFreq[w]=(wordFreq[w]||0)+1; });
    const sortedWords=Object.entries(wordFreq).sort((a,b)=>b[1]-a[1]);
    const keywords=sortedWords.slice(0,5).map(item=>item[0]);

    const summary=words.slice(0,50).join(' ')+(words.length>50?'...':'');

    let credibilityScore=5;
    if(sentenceCount>3) credibilityScore+=1;
    if(wordCount>50) credibilityScore+=1;
    if(text.includes('منبع')||text.includes('گزارش')) credibilityScore+=1;
    if(text.includes('ادعا')||text.includes('شایعه')) credibilityScore-=2;
    credibilityScore=Math.min(10,Math.max(0,credibilityScore));

    return { wordCount, sentenceCount, sentiment, sentimentEmoji, topics, keywords, summary, credibilityScore };
}

function displayAnalysis(result) {
    const div = document.getElementById('result');
    const sentimentClass = result.sentiment==='مثبت'?'sentiment-positive':result.sentiment==='منفی'?'sentiment-negative':'sentiment-neutral';
    div.innerHTML = `
        <div><span class="label">📊 کلمات:</span> ${result.wordCount}</div>
        <div><span class="label">📝 جملات:</span> ${result.sentenceCount}</div>
        <div><span class="label">😊 احساسات:</span> <span class="${sentimentClass}">${result.sentimentEmoji} ${result.sentiment}</span></div>
        <div><span class="label">🏷️ موضوعات:</span> ${result.topics.join('، ')}</div>
        <div><span class="label">🔑 کلمات کلیدی:</span> ${result.keywords.join('، ')}</div>
        <div><span class="label">📌 خلاصه:</span> ${result.summary}</div>
        <div><span class="label">✅ اعتبار:</span> ${result.credibilityScore}/10</div>
    `;
    div.style.display='block';
}

// ================================
//  دریافت اخبار
// ================================
async function fetchNews(rssUrl, fromLang) {
    const container = document.getElementById('newsList');
    container.innerHTML = '<div class="loading">⏳ در حال بارگذاری...</div>';
    try {
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (!data.items || data.items.length === 0) {
            container.innerHTML = '<div class="no-news">📭 خبری برای نمایش وجود ندارد.</div>';
            return;
        }

        const isForeign = fromLang !== 'fa';
        const items = data.items.slice(0, 10);
        let html = '';

        for (const item of items) {
            const link = item.link || '#';
            const title = item.title || 'بدون عنوان';
            
            let summary = '';
            if (item.description) {
                summary = item.description.replace(/<[^>]*>/g, '').trim();
            } else if (item.content) {
                summary = item.content.replace(/<[^>]*>/g, '').trim();
            } else if (item.title) {
                summary = item.title;
            }
            if (!summary || summary.length < 5) summary = title;
            
            const shortSummary = summary.length > 120 ? summary.substring(0, 120) + '...' : summary;

            const translateUrl = `https://translate.google.com/translate?sl=en&tl=fa&u=${encodeURIComponent(link)}`;

            html += `
                <div class="news-card" data-link="${link}">
                    <div class="title">📰 ${title}</div>
                    <div class="snippet">${shortSummary}</div>
                    <div class="summary-box">
                        <div class="summary-title">📌 خلاصه خبر</div>
                        <div>${summary}</div>
                        ${isForeign ? `
                            <div style="margin-top:8px;">
                                <a href="${translateUrl}" target="_blank" class="translate-link">🌐 ترجمه با گوگل</a>
                            </div>
                        ` : ''}
                        <a href="${link}" target="_blank" class="read-more">🔗 مطالعه کامل خبر در منبع</a>
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;

        document.querySelectorAll('.news-card').forEach(card => {
            card.addEventListener('click', function(e) {
                if (e.target.tagName === 'A') return;
                const summaryBox = this.querySelector('.summary-box');
                const isOpen = summaryBox.classList.contains('show');
                document.querySelectorAll('.news-card .summary-box').forEach(el => el.classList.remove('show'));
                if (!isOpen) {
                    summaryBox.classList.add('show');
                    setTimeout(() => {
                        this.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 100);
                }
            });
        });

    } catch (error) {
        container.innerHTML = '<div class="no-news">⚠️ خطا در دریافت اخبار</div>';
        console.error(error);
    }
}

// ================================
//  دکمه‌ها
// ================================
function setupTabs(selector) {
    document.querySelectorAll(selector).forEach(btn => {
        btn.addEventListener('click', function() {
            const parent = this.closest('.tabs');
            parent.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const url = this.dataset.url;
            const lang = this.dataset.lang || 'fa';
            fetchNews(url, lang);
        });
    });
}
