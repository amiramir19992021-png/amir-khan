<script>

/* =====================================
   جلوگیری از نمایش کد HTML داخل خبر
===================================== */

function escapeHTML(text) {

    if (!text) return '';

    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


/* =====================================
   ترجمه فقط هنگام درخواست کاربر
===================================== */

async function translateText(text) {

    if (!text || text.length < 2) {
        return text;
    }

    try {

        const url =
            'https://translate.googleapis.com/translate_a/single' +
            '?client=gtx' +
            '&sl=auto' +
            '&tl=fa' +
            '&dt=t' +
            '&q=' +
            encodeURIComponent(text);

        const response = await fetch(url);

        const data = await response.json();

        if (data && data[0]) {

            return data[0]
                .map(item => item[0])
                .join('');

        }

        return text;

    } catch (error) {

        return '⚠️ ترجمه در حال حاضر در دسترس نیست.';

    }
}


/* =====================================
   تحلیل خبر
===================================== */

function analyzeNews(text) {

    const words = text
        .trim()
        .split(/\s+/)
        .filter(Boolean);

    const wordCount = words.length;

    const sentences =
        text.match(/[^.!?؟]+[.!?؟]+/g) || [text];

    const sentenceCount = sentences.length;


    const positiveWords = [
        'خوب',
        'عالی',
        'بهبود',
        'افزایش',
        'پیروزی',
        'موفق',
        'امید',
        'رشد',
        'افتخار',
        'قوی'
    ];


    const negativeWords = [
        'بد',
        'وحشت',
        'کاهش',
        'شکست',
        'خطر',
        'بحران',
        'مرگ',
        'آسیب',
        'تحریم',
        'جنگ',
        'تورم'
    ];


    let positiveCount = 0;
    let negativeCount = 0;


    words.forEach(word => {

        if (
            positiveWords.some(
                p => word.includes(p)
            )
        ) {
            positiveCount++;
        }

        if (
            negativeWords.some(
                n => word.includes(n)
            )
        ) {
            negativeCount++;
        }

    });


    let sentiment = 'خنثی';
    let sentimentEmoji = '😐';


    if (
        positiveCount >
        negativeCount + 2
    ) {

        sentiment = 'مثبت';
        sentimentEmoji = '😊';

    } else if (
        negativeCount >
        positiveCount + 2
    ) {

        sentiment = 'منفی';
        sentimentEmoji = '😞';

    }


    let topics = [];


    if (
        text.includes('دولت') ||
        text.includes('سیاست') ||
        text.includes('رئیس‌جمهور') ||
        text.includes('مجلس')
    ) {
        topics.push('سیاسی');
    }


    if (
        text.includes('دلار') ||
        text.includes('قیمت') ||
        text.includes('بازار') ||
        text.includes('اقتصاد')
    ) {
        topics.push('اقتصادی');
    }


    if (
        text.includes('فوتبال') ||
        text.includes('ورزش')
    ) {
        topics.push('ورزشی');
    }


    if (
        text.includes('فناوری') ||
        text.includes('رایانه') ||
        text.includes('هوش مصنوعی')
    ) {
        topics.push('فناوری');
    }


    if (
        text.includes('سلامت') ||
        text.includes('درمان') ||
        text.includes('بیمارستان')
    ) {
        topics.push('سلامت');
    }


    if (topics.length === 0) {
        topics.push('عمومی');
    }


    const wordFreq = {};


    words.forEach(word => {

        if (word.length > 3) {

            wordFreq[word] =
                (wordFreq[word] || 0) + 1;

        }

    });


    const sortedWords =
        Object.entries(wordFreq)
            .sort((a, b) => b[1] - a[1]);


    const keywords =
        sortedWords
            .slice(0, 5)
            .map(item => item[0]);


    const summary =
        words.slice(0, 50).join(' ') +
        (words.length > 50 ? '...' : '');


    let credibilityScore = 5;


    if (sentenceCount > 3) {
        credibilityScore++;
    }


    if (wordCount > 50) {
        credibilityScore++;
    }


    if (
        text.includes('منبع') ||
        text.includes('گزارش')
    ) {
        credibilityScore++;
    }


    if (
        text.includes('ادعا') ||
        text.includes('شایعه')
    ) {
        credibilityScore -= 2;
    }


    credibilityScore =
        Math.min(
            10,
            Math.max(0, credibilityScore)
        );


    return {
        wordCount,
        sentenceCount,
        sentiment,
        sentimentEmoji,
        topics,
        keywords,
        summary,
        credibilityScore
    };

}


/* =====================================
   نمایش تحلیل
===================================== */

function displayAnalysis(result) {

    const div =
        document.getElementById('result');


    const sentimentClass =
        result.sentiment === 'مثبت'
            ? 'sentiment-positive'
            : result.sentiment === 'منفی'
                ? 'sentiment-negative'
                : 'sentiment-neutral';


    div.innerHTML = `

        <div>
            <span class="label">📊 تعداد کلمات:</span>
            ${result.wordCount}
        </div>

        <div>
            <span class="label">📝 تعداد جملات:</span>
            ${result.sentenceCount}
        </div>

        <div>
            <span class="label">😊 احساسات:</span>
            <span class="${sentimentClass}">
                ${result.sentimentEmoji}
                ${result.sentiment}
            </span>
        </div>

        <div>
            <span class="label">🏷️ موضوع:</span>
            ${result.topics.join('، ')}
        </div>

        <div>
            <span class="label">🔑 کلمات کلیدی:</span>
            ${result.keywords.length
                ? result.keywords.join('، ')
                : 'مشخص نشد'}
        </div>

        <div>
            <span class="label">📌 خلاصه:</span>
            ${escapeHTML(result.summary)}
        </div>

        <div>
            <span class="label">✅ امتیاز اعتبار:</span>
            ${result.credibilityScore}/10
        </div>

    `;


    div.style.display = 'block';

}


/* =====================================
   دریافت اخبار
===================================== */

async function fetchNews(rssUrl, fromLang) {

    const container =
        document.getElementById('newsList');


    container.innerHTML =
        '<div class="loading">⏳ در حال بارگذاری اخبار...</div>';


    try {

        const apiUrl =
            'https://api.rss2json.com/v1/api.json?rss_url=' +
            encodeURIComponent(rssUrl);


        const response =
            await fetch(apiUrl);


        if (!response.ok) {
            throw new Error('Network error');
        }


        const data =
            await response.json();


        if (
            !data.items ||
            data.items.length === 0
        ) {

            container.innerHTML =
                '<div class="no-news">📭 خبری برای نمایش وجود ندارد.</div>';

            return;
        }


        const isForeign =
            fromLang !== 'fa';


        /*
           فقط ۸ خبر می‌گیریم تا سرعت موبایل بهتر شود
        */

        const items =
            data.items.slice(0, 8);


        let html = '';


        items.forEach(item => {

            const link =
                item.link || '#';


            const title =
                item.title || 'بدون عنوان';


            let summary = '';


            if (item.description) {

                summary =
                    item.description
                        .replace(/<[^>]*>/g, '')
                        .trim();

            } else if (item.content) {

                summary =
                    item.content
                        .replace(/<[^>]*>/g, '')
                        .trim();

            } else {

                summary = title;

            }


            if (
                !summary ||
                summary.length < 5
            ) {

                summary = title;

            }


            const shortSummary =
                summary.length > 140
                    ? summary.substring(0, 140) + '...'
                    : summary;


            const safeTitle =
                escapeHTML(title);


            const safeSummary =
                escapeHTML(summary);


            const safeShortSummary =
                escapeHTML(shortSummary);


            html += `

                <div
                    class="news-card"
                    data-link="${escapeHTML(link)}"
                    data-summary="${safeSummary}"
                    data-foreign="${isForeign}"
                >

                    <div class="title">

                        📰 ${safeTitle}

                        ${
                            isForeign
                            ? '<span class="foreign-badge">بین‌الملل</span>'
                            : ''
                        }

                    </div>


                    <div class="snippet">
                        ${safeShortSummary}
                    </div>


                    <div class="summary-box">

                        <div class="summary-title">
                            📌 خلاصه خبر
                        </div>


                        ${
                            isForeign
                            ? `

                                <div class="summary-en">
                                    🌍 ${safeSummary}
                                </div>

                                <button
                                    class="translate-btn"
                                    type="button">
                                    🇮🇷 ترجمه خبر
                                </button>

                                <div
                                    class="summary-fa"
                                    style="display:none;">
                                </div>

                            `
                            : `

                                <div>
                                    ${safeSummary}
                                </div>

                            `
                        }


                        <a
                            href="${escapeHTML(link)}"
                            target="_blank"
