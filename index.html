<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیرخوان</title>
    <style>
        body { font-family: Tahoma; background: #f0f2f5; padding: 20px; direction: rtl; }
        .box { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 20px; }
        button { width: 100%; padding: 15px; background: #3b82f6; color: white; border: none; border-radius: 30px; font-size: 18px; margin-top: 10px; }
        .news { background: #f1f5f9; padding: 15px; margin: 10px 0; border-radius: 12px; border-right: 4px solid #3b82f6; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🧠 امیرخوان</h1>
        <p>دستیار هوشمند رسانه</p>

        <div class="news">🔥 قیمت دلار امروز ۶۰,۵۰۰ تومان شد</div>
        <div class="news">📈 نتایج کنکور ۱۴۰۵ اعلام شد</div>
        <div class="news">⚠️ هشدار هواشناسی برای تهران</div>

        <button id="testBtn">کلیک کن</button>
        <p id="message" style="margin-top:15px;color:green;"></p>
    </div>

    <script>
        document.getElementById('testBtn').addEventListener('click', function() {
            document.getElementById('message').textContent = '✅ دکمه کار می‌کند!';
        });
    </script>
</body>
</html>
