<body>

<div class="container">
    <div class="header">
        <h1>🧠 <span>امیر</span>خوان</h1>
        <div class="header-actions">
            <button id="readModeBtn" title="حالت مطالعه">📖</button>
            <button id="themeToggle" title="تغییر تم">🌙</button>
        </div>
    </div>

    <!-- ===== نمودار پربازدیدها ===== -->
    <div class="chart-box">
        <h3>📊 پربازدیدترین اخبار امروز</h3>
        <canvas id="trendChart"></canvas>
    </div>

    <div class="category">
        <div class="category-title">🇮🇷 داخلی</div>
        <div class="tabs" id="internalTabs">
            <button class="active" data-url="https://www.irna.ir/rss" data-lang="fa">ایرنا</button>
            <button data-url="https://www.mehrnews.com/rss" data-lang="fa">مهر</button>
            <button data-url="https://www.imna.ir/rss" data-lang="fa">ایمنا</button>
            <button data-url="https://www.donya-e-eqtesad.com/rss" data-lang="fa">دنیای اقتصاد</button>
        </div>
    </div>

    <div class="category">
        <div class="category-title">🌍 خارجی و علمی</div>
        <div class="tabs" id="externalScienceTabs">
            <button data-url="https://www.rt.com/rss" data-lang="en">راشا تودی</button>
            <button data-url="https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml" data-lang="en">نیویورک تایمز</button>
            <button data-url="https://www.theguardian.com/world/rss" data-lang="en">گاردین</button>

        </div>
    </div>

    <div class="news-list" id="newsList">
        <div class="loading">⏳ انتخاب کنید...</div>
    </div>

    <!-- ===== تحلیل هوشمند با Gemini ===== -->
    <div class="analysis-box">
        <h3>🧠 تحلیل هوشمند با Gemini</h3>

            <button class="active" data-mode="analyze">📊 تحلیل کامل</button>
            <button data-mode="summary">📝 خلاصه</button>

<script>
// ================================
//  کلید Gemini API
// ================================
const GEMINI_API_KEY = 'YOUR_GEMINI_API_KEY'; // ← کلید خود را اینجا قرار دهید

// ================================
//  حالت مطالعه
// ================================
let readMode = false;
document.getElementById('readModeBtn').addEventListener('click', function() {
    readMode = !readMode;
    document.querySelectorAll('.news-card .snippet, .news-card .meta').forEach(el => {
        el.style.display = readMode ? 'none' : 'block';
    });
    document.querySelectorAll('.news-card .title').forEach(el => {
        el.style.fontSize = readMode ? '20px' : '15px';
        el.style.lineHeight = readMode ? '2' : '1.5';
    });
    this.textContent = readMode ? '📖 (فعال)' : '📖';
});

// ================================
//  تم شب/روز
// ================================
const themeToggle = document.getElementById('themeToggle');
let darkMode = localStorage.getItem('amirkhan-theme') === 'dark';
if (darkMode) {
    document.body.classList.add('dark-mode');
    themeToggle.textContent = '☀️';
}
themeToggle.addEventListener('click', function() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('amirkhan-theme', isDark ? 'dark' : 'light');
    this.textContent = isDark ? '☀️' : '🌙';
});

// ================================
//  نمودار پربازدیدها
// ================================
let trendChart = null;

function updateChart(articles) {
    const ctx = document.getElementById('trendChart').getContext('2d');
    const labels = articles.map(a => a.title.substring(0, 20) + '...');
    const data = articles.map(a => Math.floor(Math.random() * 100) + 10);

    if (trendChart) {
        trendChart.destroy();
    }

    trendChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'تعداد بازدید (شبیه‌سازی)',
                data: data,
                backgroundColor: ['#2563eb', '#16a34a', '#7c3aed', '#f59e0b', '#dc2626', '#0284c7'],
                borderColor: '#fff',
                borderWidth: 1,
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
}

// ================================
//  تحلیل با Gemini
// ================================
async function callGemini(prompt) {
    try {
        const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`,
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            }
        );
        const data = await res.json();
        if (data.candidates && data.candidates.length > 0) {
            return data.candidates[0].content.parts[0].text;
        }
        return 'پاسخی دریافت نشد. لطفاً دوباره تلاش کنید.';
    } catch (error) {
        console.error('خطا:', error);
        return '⚠️ خطا در ارتباط با Gemini.';
    }
}

document.getElementById('analyzeBtn').addEventListener('click', async function() {
    const text = document.getElementById('newsText').value.trim();
    const resultDiv = document.getElementById('result');
    const geminiDiv = document.getElementById('geminiResult');
    
    if (!text) {
        alert('⚠️ لطفاً یک متن یا لینک خبر وارد کنید.');
        return;
    }

    // تشخیص حالت تحلیل
    const activeMode = document.querySelector('.ai-options .active');
    const mode = activeMode ? activeMode.dataset.mode : 'analyze';

    let prompt = '';
    switch(mode) {
        case 'analyze':
            prompt = `تحلیل کامل این خبر را انجام بده. شامل احساسات، موضوع، کلمات کلیدی، خلاصه و امتیاز اعتبار (۰ تا ۱۰). متن: ${text}`;
            break;
        case 'summary':
            prompt = `خلاصه‌ای دقیق و کامل از این خبر بنویس: ${text}`;
            break;
        case 'sentiment':
            prompt = `احساسات کلی این خبر را تحلیل کن و بگو مثبت است، منفی یا خنثی. متن: ${text}`;
            break;
        case 'keywords':
            prompt = `۵ کلمه کلیدی اصلی این خبر را استخراج کن: ${text}`;
            break;
        default:
            prompt = `تحلیل کن: ${text}`;
    }

    // نمایش بارگذاری
    geminiDiv.innerHTML = '<div class="loading-text">⏳ در حال تحلیل با Gemini...</div>';
    geminiDiv.classList.add('show');
    resultDiv.style.display = 'none';

    const response = await callGemini(prompt);
    geminiDiv.innerHTML = `<div>🧠 ${response}</div>`;
});

// ================================
//  انتخاب حالت تحلیل
// ================================
document.querySelectorAll('.ai-options button').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.ai-options button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
    });
});

// ================================
//  تحلیل ساده (برای نمایش سریع)
// ================================
function analyzeNews(text) {
    const words = text.split(/\s+/);
    const wordCount = words.length;
    const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
    const sentenceCount = sentences.length;

    let positiveWords = ['خوب','عالی','بهبود','افزایش','پیروزی','موفق','امید','رشد','افتخار','قوی'];
    let negativeWords = ['بد','وحشت','کاهش','شکست','خطر','بحران','مرگ','آسیب','تحریم','جنگ','تورم'];
    let positiveCount=0, negativeCount=0;
    words.forEach(w => {
        if(positiveWords.some(p => w.includes(p))) positiveCount++;
        if(negativeWords.some(n => w.includes(n))) negativeCount++;
    });
    let sentiment='خنثی', sentimentEmoji='😐';
    if(positiveCount > negativeCount+2){ sentiment='مثبت'; sentimentEmoji='😊'; }
    else if(negativeCount > positiveCount+2){ sentiment='منفی'; sentimentEmoji='😞'; }

    let topics=[];
    if(text.includes('دولت')||text.includes('سیاست')||text.includes('رئیس‌جمهور')) topics.push('سیاسی');
    if(text.includes('دلار')||text.includes('قیمت')||text.includes('بازار')||text.includes('اقتصاد')) topics.push('اقتصادی');
    if(text.includes('فوتبال')||text.includes('ورزش')) topics.push('ورزشی');
    if(text.includes('فناوری')||text.includes('رایانه')||text.includes('هوش مصنوعی')) topics.push('فناوری');
    if(text.includes('سلامت')||text.includes('درمان')||text.includes('بیمارستان')) topics.push('سلامت');
    if(topics.length===0) topics.push('عمومی');

    const wordFreq={};
    words.forEach(w=>{ if(w.length>3) wordFreq[w]=(wordFreq[w]||0)+1; });
    const sortedWords=Object.entries(wordFreq).sort((a,b)=>b[1]-a[1]);
    const keywords=sortedWords.slice(0,5).map(item=>item[0]);

    const summary=words.slice(0,50).join(' ')+(words.length>50?'...':'');

    let credibilityScore=5;
    if(sentenceCount>3) credibilityScore+=1;
    if(wordCount>50) credibilityScore+=1;
    if(text.includes('منبع')||text.includes('گزارش')) credibilityScore+=1;
    if(text.includes('ادعا')||text.includes('شایعه')) credibilityScore-=2;
    credibilityScore=Math.min(10,Math.max(0,credibilityScore));

    return { wordCount, sentenceCount, sentiment, sentimentEmoji,
