<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیرخوان - نسخه کامل</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background: #f0f4f8;
            padding: 16px;
            direction: rtl;
            color: #1e293b;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .header {
            background: #ffffff;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-bottom: 3px solid #2563eb;
        }
        .header h1 { font-size: 26px; color: #2563eb; }
        .header h1 span { color: #1e40af; }
        .category {
            background: #ffffff;
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .category-title {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tabs button {
            padding: 6px 14px;
            border: none;
            border-radius: 30px;
            background: #f1f5f9;
            color: #334155;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tabs button:hover { background: #e2e8f0; }
        .tabs button.active {
            background: #2563eb;
            color: #fff;
        }
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .news-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-right: 4px solid #2563eb;
            transition: 0.2s;
            cursor: pointer;
        }
        .news-card:hover {
            box-shadow: 0 4px 16px rgba(37,99,235,0.08);
        }
        .news-card .title {
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .news-card .title .badge-hot {
            background: #ef4444;
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 30px;
            margin-right: 6px;
        }
        .news-card .title .badge-new {
            background: #22c55e;
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 30px;
            margin-right: 6px;
        }
        .news-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 12px;
            color: #64748b;
            margin: 6px 0 4px;
        }
        .news-card .meta .views {
            color: #2563eb;
        }
        .news-card .meta .score {
            background: #e2e8f0;
            padding: 0 8px;
            border-radius: 30px;
            color: #1e293b;
        }
        .news-card .snippet {
            font-size: 13px;
            color: #475569;
            line-height: 1.6;
            margin-top: 2px;
        }
        .news-card .summary-box {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            border-right: 3px solid #2563eb;
            font-size: 13px;
            line-height: 1.8;
            color: #1e293b;
        }
        .news-card .summary-box.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .news-card .summary-box .summary-title {
            font-weight: 600;
            color: #2563eb;
            margin-bottom: 4px;
        }
        .news-card .summary-box .summary-en {
            background: #f1f5f9;
            padding: 6px 10px;
            border-radius: 8px;
            margin-top: 4px;
            color: #334155;
        }
        .news-card .summary-box .summary-fa {
            background: #dbeafe;
            padding: 6px 10px;
            border-radius: 8px;
            margin-top: 4px;
            color: #1e40af;
        }
        .news-card .summary-box .read-more {
            display: inline-block;
            margin-top: 8px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
        }
        .news-card .summary-box .read-more:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 30px 0;
        }
        .analysis-box {
            background: #ffffff;
            border-radius: 14px;
            padding: 16px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .analysis-box h3 { color: #2563eb; margin-bottom: 8px; }
        .analysis-box textarea {
            width: 100%;
            height: 70px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px;
            background: #f8fafc;
            color: #0f172a;
            font-family: Tahoma, sans-serif;
            resize: vertical;
        }
        .analysis-box textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .analysis-box button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 30px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .analysis-box button:hover { background: #1d4ed8; }
        #result {
            margin-top: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            display: none;
            font-size: 13px;
            line-height: 1.8;
            color: #1e293b;
            border: 1px solid #e2e8f0;
        }
        #result .label { color: #2563eb; font-weight: 600; }
        .sentiment-positive { color: #16a34a; }
        .sentiment-negative { color: #dc2626; }
        .sentiment-neutral { color: #eab308; }
        .foreign-badge {
            background: #dbeafe;
            color: #2563eb;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 40px;
            margin-right: 8px;
            border: 1px solid #bfdbfe;
        }
        .no-news {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px dashed #e2e8f0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🧠 <span>امیر</span>خوان</h1>
    </div>

    <div class="category">
        <div class="category-title">🇮🇷 داخلی</div>
        <div class="tabs" id="internalTabs">
            <button class="active" data-url="https://www.irna.ir/rss" data-lang="fa">ایرنا</button>
            <button data-url="https://www.mehrnews.com/rss" data-lang="fa">مهر</button>
            <button data-url="https://www.imna.ir/rss" data-lang="fa">ایمنا</button>
            <button data-url="https://www.donya-e-eqtesad.com/rss" data-lang="fa">دنیای اقتصاد</button>
        </div>
    </div>

    <div class="category">
        <div class="category-title">🌍 خارجی</div>
        <div class="tabs" id="externalTabs">
            <button data-url="https://www.rt.com/rss" data-lang="en">راشا تودی</button>
            <button data-url="https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml" data-lang="en">نیویورک تایمز</button>
            <button data-url="https://www.theguardian.com/world/rss" data-lang="en">گاردین</button>
            <button data-url="https://feeds.washingtonpost.com/rss/world" data-lang="en">واشنگتن پست</button>
            <button data-url="https://www.nbcnews.com/feed" data-lang="en">ان‌بی‌سی</button>
            <button data-url="https://www.cnbc.com/id/100003114/device/rss/rss.html" data-lang="en">سی‌ان‌بی‌سی</button>
            <button data-url="https://feeds.bloomberg.com/markets/news.rss" data-lang="en">بلومبرگ</button>
        </div>
    </div>

    <div class="news-list" id="newsList">
        <div class="loading">⏳ انتخاب کنید...</div>
    </div>

    <div class="analysis-box">
        <h3>🔎 تحلیل خبر</h3>
        <textarea id="newsText" placeholder="متن خبر را برای تحلیل وارد کن..."></textarea>
        <button id="analyzeBtn">🧠 تحلیل کن</button>
        <div id="result"></div>
    </div>
</div>

<!-- ===================================== -->
<!-- چت‌بات امیرخوان (Gemini)              -->
<!-- ===================================== -->
<div id="chatbot-container" style="position:fixed; bottom:20px; right:20px; z-index:9999; font-family:Tahoma, sans-serif;">
    <button id="chat-toggle" style="width:60px; height:60px; border-radius:50%; background:#2563eb; border:none; color:#fff; font-size:28px; cursor:pointer; box-shadow:0 8px 25px rgba(37,99,235,0.4); transition:0.3s;">
        💬
    </button>
    <div id="chat-window" style="display:none; position:absolute; bottom:80px; right:0; width:340px; height:450px; background:#ffffff; border-radius:20px; box-shadow:0 12px 40px rgba(0,0,0,0.15); overflow:hidden; border:1px solid #e2e8f0; flex-direction:column;">
        <div style="background:#2563eb; padding:14px 18px; color:#fff; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:600;">🤖 امیرخوان یار</span>
            <button id="chat-close" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
        </div>
        <div id="chat-messages" style="flex:1; padding:12px 16px; overflow-y:auto; background:#f8fafc; display:flex; flex-direction:column; gap:8px; height:320px;">
            <div style="background:#e2e8f0; padding:8px 14px; border-radius:16px; border-bottom-right-radius:4px; max-width:85%; align-self:flex-start; font-size:14px; color:#1e293b;">
                👋 سلام! من امیرخوان یار هستم. هر سوالی درباره‌ی اخبار داری، بپرس.
            </div>
        </div>
        <div style="padding:12px 16px; border-top:1px solid #e2e8f0; display:flex; gap:8px; background:#fff;">
            <input id="chat-input" type="text" placeholder="سوال خود را بپرس..." style="flex:1; padding:8px 14px; border:1px solid #e2e8f0; border-radius:30px; outline:none; font-size:14px;">
            <button id="chat-send" style="padding:8px 18px; background:#2563eb; color:#fff; border:none; border-radius:30px; cursor:pointer; font-weight:600;">➤</button>
        </div>
    </div>
</div>

<script>
// ================================
//  تحلیل خبر
// ================================
function analyzeNews(text) {
    const words = text.split(/\s+/);
    const wordCount = words.length;
    const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
    const sentenceCount = sentences.length;

    let positiveWords = ['خوب','عالی','بهبود','افزایش','پیروزی','موفق','امید','رشد','افتخار','قوی'];
    let negativeWords = ['بد','وحشت','کاهش','شکست','خطر','بحران','مرگ','آسیب','تحریم','جنگ','تورم'];
    let positiveCount=0, negativeCount=0;
    words.forEach(w => {
        if(positiveWords.some(p => w.includes(p))) positiveCount++;
        if(negativeWords.some(n => w.includes(n))) negativeCount++;
    });
    let sentiment='خنثی', sentimentEmoji='😐';
    if(positiveCount > negativeCount+2){ sentiment='مثبت'; sentimentEmoji='😊'; }
    else if(negativeCount > positiveCount+2){ sentiment='منفی'; sentimentEmoji='😞'; }

    let topics=[];
    if(text.includes('دولت')||text.includes('سیاست')||text.includes('رئیس‌جمهور')) topics.push('سیاسی');
    if(text.includes('دلار')||text.includes('قیمت')||text.includes('بازار')||text.includes('اقتصاد')) topics.push('اقتصادی');
    if(text.includes('فوتبال')||text.includes('ورزش')) topics.push('ورزشی');
    if(text.includes('فناوری')||text.includes('رایانه')||text.includes('هوش مصنوعی')) topics.push('فناوری');
    if(text.includes('سلامت')||text.includes('درمان')||text.includes('بیمارستان')) topics.push('سلامت');
    if(topics.length===0) topics.push('عمومی');

    const wordFreq={};
    words.forEach(w=>{ if(w.length>3) wordFreq[w]=(wordFreq[w]||0)+1; });
    const sortedWords=Object.entries(wordFreq).sort((a,b)=>b[1]-a[1]);
    const keywords=sortedWords.slice(0,5).map(item=>item[0]);

    const summary=words.slice(0,50).join(' ')+(words.length>50?'...':'');

    let credibilityScore=5;
    if(sentenceCount>3) credibilityScore+=1;
    if(wordCount>50) credibilityScore+=1;
    if(text.includes('منبع')||text.includes('گزارش')) credibilityScore+=1;
    if(text.includes('ادعا')||text.includes('شایعه')) credibilityScore-=2;
    credibilityScore=Math.min(10,Math.max(0,credibilityScore));

    return { wordCount, sentenceCount, sentiment, sentimentEmoji, topics, keywords, summary, credibilityScore };
}

function displayAnalysis(result) {
    const div = document.getElementById('result');
    const sentimentClass = result.sentiment==='مثبت'?'sentiment-positive':result.sentiment==='منفی'?'sentiment-negative':'sentiment-neutral';
    div.innerHTML = `
        <div><span class="label">📊 کلمات:</span> ${result.wordCount}</div>
        <div><span class="label">📝 جملات:</span> ${result.sentenceCount}</div>
        <div><span class="label">😊 احساسات:</span> <span class="${sentimentClass}">${result.sentimentEmoji} ${result.sentiment}</span></div>
        <div><span class="label">🏷️ موضوعات:</span> ${result.topics.join('، ')}</div>
        <div><span class="label">🔑 کلمات کلیدی:</span> ${result.keywords.join('، ')}</div>
        <div><span class="label">📌 خلاصه:</span> ${result.summary}</div>
        <div><span class="label">✅ اعتبار:</span> ${result.credibilityScore}/10</div>
    `;
    div.style.display='block';
}

// ================================
//  دریافت اخبار
// ================================
async function fetchNews(rssUrl, fromLang) {
    const container = document.getElementById('newsList');
    container.innerHTML = '<div class="loading">⏳ در حال بارگذاری...</div>';
    try {
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (!data.items || data.items.length === 0) {
            container.innerHTML = '<div class="no-news">📭 خبری برای نمایش وجود ندارد.</div>';
            return;
        }

        const isForeign = fromLang !== 'fa';
        const items = data.items.slice(0, 10);
        let html = '';

        for (const item of items) {
            const link = item.link || '#';
            const title = item.title || 'بدون عنوان';
            
            let summary = '';
            if (item.description) {
                summary = item.description.replace(/<[^>]*>/g, '').trim();
            } else if (item.content) {
                summary = item.content.replace(/<[^>]*>/g, '').trim();
            } else if (item.title) {
                summary = item.title;
            }
            if (!summary || summary.length < 5) summary = title;
            
            const shortSummary = summary.length > 120 ? summary.substring(0, 120) + '...' : summary;

            let pubDate = item.pubDate || '';
            let timeAgo = '';
            if (pubDate) {
                try {
                    const date = new Date(pubDate);
                    const now = new Date();
                    const diffMs = now - date;
                    const diffMins = Math.floor(diffMs / 60000);
                    const diffHours = Math.floor(diffMins / 60);
                    const diffDays = Math.floor(diffHours / 24);
                    if (diffDays > 0) timeAgo = `${diffDays} روز پیش`;
                    else if (diffHours > 0) timeAgo = `${diffHours} ساعت پیش`;
                    else if (diffMins > 0) timeAgo = `${diffMins} دقیقه پیش`;
                    else timeAgo = 'لحظاتی پیش';
                } catch { timeAgo = ''; }
            }

            let badge = '';
            if (timeAgo.includes('ساعت') && parseInt(timeAgo) < 3) {
                badge = '<span class="badge-hot">🔥 داغ</span>';
            } else if (timeAgo.includes('دقیقه') || timeAgo === 'لحظاتی پیش') {
                badge = '<span class="badge-new">🆕 جدید</span>';
            }

            const views = Math.floor(Math.random() * 500) + 50;
            const credibility = Math.floor(Math.random() * 5) + 5;

            // برای خبرهای خارجی، خلاصه دوزبانه رو آماده کن
            let summaryEn = '';
            let summaryFa = '';
            if (isForeign) {
                summaryEn = summary;
                // یک ترجمه‌ی ساده‌ی ساختگی برای نمایش (فقط برای نمونه)
                summaryFa = '🔹 این خبر به زبان انگلیسی است. برای مشاهده‌ی ترجمه، روی دکمه‌ی ترجمه در گوگل کلیک کنید.';
            }

            html += `
                <div class="news-card" data-link="${link}">
                    <div class="title">
                        📰 ${title}
                        ${isForeign ? '<span class="foreign-badge">انگلیسی</span>' : ''}
                        ${badge}
                    </div>
                    <div class="meta">
                        <span>🕒 ${timeAgo || 'تاریخ نامشخص'}</span>
                        <span class="views">👁️ ${views} بازدید</span>
                        <span class="score">⭐ اعتبار: ${credibility}/10</span>
                    </div>
                    <div class="snippet">${shortSummary}</div>
                    
                    <div class="summary-box">
                        <div class="summary-title">📌 خلاصه خبر</div>
                        ${isForeign ? `
                            <div class="summary-en">🇬🇧 ${summaryEn}</div>
                            <div class="summary-fa">🇮🇷 ${summaryFa}</div>
                            <div style="margin-top:6px;">
                                <a href="https://translate.google.com/translate?sl=en&tl=fa&u=${encodeURIComponent(link)}" target="_blank" style="color:#2563eb;text-decoration:none;font-weight:500;">🌐 ترجمه با گوگل</a>
                            </div>
                        ` : `
                            <div>${summary}</div>
                        `}
                        <a href="${link}" target="_blank" class="read-more">🔗 مطالعه کامل خبر در منبع</a>
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;

        document.querySelectorAll('.news-card').forEach(card => {
            card.addEventListener('click', function(e) {
                if (e.target.tagName === 'A') return;
                const summaryBox = this.querySelector('.summary-box');
                const isOpen = summaryBox.classList.contains('show');
                document.querySelectorAll('.news-card .summary-box').forEach(el => el.classList.remove('show'));
                if (!isOpen) {
                    summaryBox.classList.add('show');
                    setTimeout(() => {
                        this.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 100);
                }
            });
        });

    } catch (error) {
        container.innerHTML = '<div class="no-news">⚠
